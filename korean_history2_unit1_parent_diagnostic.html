":["p24-k1","p24-k2"]}},"glossary":{"d2:복벽주의":{"day":2,"term":"복벽주의","hanja":"復辟主義","literal":"복벽(復辟)은 물러난 임금이나 왕조를 다시 세운다는 뜻입니다.","simple":"왕이나 황제가 다스리던 체제로 되돌아가려는 생각입니다.","context":"독립 의군부는 고종을 다시 황제로 세우는 왕정 복고를 지향했습니다.","contrast":"공화주의는 왕을 다시 세우는 것이 아니라 국민이 주권을 가진 공화국을 세우려는 생각입니다.","memory":"복벽 = 왕을 다시 세움"},"d2:공화주의":{"day":2,"term":"공화주의","hanja":"共和主義","literal":"공화(共和)는 군주 한 사람이 아니라 공공의 주권으로 나라를 운영한다는 뜻입니다.","simple":"왕이 없는 나라에서 국민이 나라의 주인이 되어 정치하는 것을 지향하는 생각입니다.","context":"대한 광복회는 독립 뒤 민주 공화제 국가를 세우려 했습니다.","contrast":"복벽주의는 왕정 회복, 공화주의는 국민 주권의 공화국을 지향합니다.","memory":"공화 = 왕 없이 국민이 주인"},"d2:비밀 결사":{"day":2,"term":"비밀 결사","hanja":"秘密結社","literal":"비밀(秘密) + 결사(結社: 뜻을 같이하는 사람들이 만든 단체)","simple":"탄압을 피하기 위해 조직과 활동을 밖에 드러내지 않고 만든 단체입니다.","context":"무단 통치 아래 독립 의군부와 대한 광복회는 비밀 결사로 활동했습니다.","contrast":"공개 단체는 이름·회원·활동을 드러내지만 비밀 결사는 조직을 숨깁니다.","memory":"비밀 결사 = 숨어서 활동한 조직"},"d2:민족 자결주의":{"day":2,"term":"민족 자결주의","hanja":"民族自決主義","literal":"민족(民族)이 자기의 일을 스스로 결정(自決)한다는 뜻입니다.","simple":"각 민족이 다른 나라의 지배를 받지 않고 정치적 운명을 스스로 정해야 한다는 주장입니다.","context":"제1차 세계 대전 뒤 알려진 이 주장은 한국인의 독립 열망을 높였습니다.","contrast":"모든 식민지 민족에게 실제로 똑같이 적용된 원칙은 아니었습니다.","memory":"자결 = 내 운명은 내가 결정"},"d2:민주 공화제":{"day":2,"term":"민주 공화제","hanja":"民主共和制","literal":"민주(民主: 국민이 주인) + 공화제(共和制: 왕이 없는 국가 체제)","simple":"왕이 아니라 국민에게 주권이 있고, 대표 기관을 통해 나라를 운영하는 제도입니다.","context":"대한민국 임시 정부는 민주 공화제를 국가 형태로 채택했습니다.","contrast":"군주제는 왕이 국가 원수이지만 민주 공화제에서는 국민이 주권의 근원입니다.","memory":"민주 공화제 = 국민이 주인, 왕은 없음"},"d2:삼권 분립":{"day":2,"term":"삼권 분립","hanja":"三權分立","literal":"세 권력(三權)을 나누어 세운다(分立)는 뜻입니다.","simple":"입법·행정·사법 권력을 서로 다른 기관이 맡아 한 곳에 권력이 몰리지 않게 하는 원리입니다.","context":"임시 의정원은 입법, 국무원은 행정, 법원은 사법을 담당했습니다.","contrast":"권력 집중은 한 기관이나 한 사람이 여러 권력을 함께 가지는 상태입니다.","memory":"입법·행정·사법을 나눔"},"d2:국민 주권":{"day":2,"term":"국민 주권","hanja":"國民主權","literal":"나라의 주권(主權)이 국민(國民)에게 있다는 뜻입니다.","simple":"국가 권력의 근원과 최종 결정권이 국민에게 있다는 원리입니다.","context":"대동단결 선언과 대한민국 임시 정부는 황제가 아니라 국민이 주권의 주체임을 강조했습니다.","contrast":"군주 주권은 국가의 주권이 왕이나 황제에게 있 .","context":"국민 대표 회의에서 개조파와 대립했습니다.","contrast":"개조파는 기존 임시 정부를 유지하면서 고치자고 주장했습니다.","memory":"창조파 = 새 정부를 만들자"},"d2:개조파":{"day":2,"term":"개조파","hanja":"改造派","literal":"기존 것을 고쳐 바꾼다(改造)는 입장의 세력입니다.","simple":"대한민국 임시 정부를 없애지 말고 조직과 제도를 고쳐 운영하자고 주장한 세력입니다.","context":"국민 대표 회의에서 창조파와 대립했습니다.","contrast":"창조파는 기존 정부를 해체하고 새 정부를 세우자고 했습니다.","memory":"개조파 = 기존 정부를 고치자"},"d2:국무령제":{"day":2,"term":"국무령제","hanja":"國務領制","literal":"국무령(國務領)이 행정부를 이끄는 제도입니다.","simple":"대한민국 임시 정부가 대통령제를 바꾼 뒤 국무령을 중심으로 운영한 지도 체제입니다.","context":"이승만 탄핵 이후 임시 정부의 지도 체제를 정비하는 과정에서 마련되었습니다.","contrast":"대통령제는 대통령이 중심이고, 국무령제는 국무령과 국무원이 중심입니다.","memory":"국무령제 = 대통령 대신 국무령 중심"},"d2:탄핵":{"day":2,"term":"탄핵","hanja":"彈劾","literal":"공직자의 잘못을 따져 책임을 묻는 절차입니다.","simple":"공직자가 헌법이나 법을 어겼을 때 의회 등이 그 책임을 물어 직위에서 물러나게 하는 제도입니다.","context":"대한민국 임시 정부는 이승만 대통령을 탄핵했습니다.","contrast":"단순한 비판이 아니라 공식 절차를 거쳐 공직 책임을 묻는 것입니다.","memory":"탄핵 = 공직 책임을 공식적으로 물음"},"d2:대동단결 선언":{"day":2,"term":"대동단결 선언","hanja":"大同團結宣言","literal":"큰 뜻으로 하나가 되어 단결하자는 선언입니다.","simple":"1917년 독립운동 세력이 국민 주권과 임시 정부 수립의 필요성을 주장한 선언입니다.","context":"황제가 잃은 주권이 국민에게 계승되었다고 보았습니다.","contrast":"2·8 독립 선언은 1919년 일본 유학생들이 발표했습니다.","memory":"1917 · 국민 주권 · 임시 정부"},"d2:민족 대표":{"day":2,"term":"민족 대표","hanja":"民族代表","literal":"민족을 대표하여 의사를 밝히는 사람들입니다.","simple":"3·1 운동에서 독립 선언서를 발표하고 독립 의사를 알린 종교계 인사 33명을 가리킵니다.","context":"민족 대표는 태화관에서 독립 선언식을 진행했고, 학생과 시민은 탑골 공원에서 만세 시위를 전개했습니다.","contrast":"민족 대표의 선언 장소와 학생·시민의 시위 장소를 구별해야 합니다.","memory":"민족 대표 33인 · 태화관"},"d2:구미 위원부":{"day":2,"term":"구미 위원부","hanja":"歐美委員部","literal":"구미(歐美)는 유럽과 미국을 가리킵니다.","simple":"대한민국 임시 정부가 미국에서 외교 활동을 하기 위해 설치한 기관입니다.","context":"이승만을 중심으로 국제사회에 한국 독립을 알리는 활동을 했습니다.","contrast":"신한청년당은 김규식을 파리 강화 회의에 파견한 단체입니다.","memory":"구미 위원부 = 미국 외교 기관"},"d2:외교":{"day":2,"term":"외교","hanja":"外交","literal":"나라 밖(外)의 상대와 사귀고 교섭(交)하는 활동입니다.","simple":"다른 나라나 국제회의를 상대로 자기 나라의 입장을 알리고 지원을 얻는 활동입니다.","context":"김규식의 파리 강화 회의 활동과 구미 위원부 활동이 대표적입니다.","contrast":"무장 투쟁은 군사력으로 싸우는 활동이고, 외교는 국제사회에 function readState(day){try{return JSON.parse(localStorage.getItem(META.storageKeys[String(day)])||'{}')}catch(e){return {}}}
function allStates(){const out={};for(let d=1;d<=6;d++)out[d]=readState(d);return out}
function problemMap(){const m={};META.problems.forEach(p=>m[p.uid]=p);return m}const PM=problemMap();
function memMeta(day,id){return META.memory[`d${day}:${id}`]||null}
function depthCode(v=''){const m=String(v).match(/D[0-5]/);return m?m[0]:''}
const DNAME={D0:'발문·조건 읽기',D1:'시대·순서 위치',D2:'핵심 개념·용어',D3:'원인·결과·서술',D4:'비교·구별',D5:'사료·새 문제 적용'};
function demoStates(){
 const now=Date.now(),S={};for(let d=1;d<=6;d++)S[d]={attempts:[],problemStatus:{},memoryLog:{},wrongNotes:{},termLog:{},finishedAt:d<4?now-d*86400000:null};
 const add=(d,pid,correct,depth,wrongCount=1)=>{S[d].attempts.push({problemId:pid,correct,depth:correct?null:depth,at:now-Math.random()*6*86400000});S[d].problemStatus[pid]={status:correct?'mastered':'repair',wrongCount,lastDepth:depth,at:now};if(!correct)S[d].wrongNotes[pid]={problemId:pid,depth,wrongCount,status:'learning',lastAt:now}};
 add(1,'p02',false,'D1 시대 위치',2);add(1,'p07',true,'',1);add(2,'p01',false,'D3 원인·결과·의의',2);add(2,'p09',false,'D2 핵심 개념',1);add(2,'p14',true,'',1);add(3,'p04',false,'D4 비교·구별',2);add(3,'p15',false,'D1 시대 위치',1);add(4,'p06',false,'D2 핵심 개념',1);add(5,'p03',true,'',1);
 const setMem=(d,id,a,c,last)=>S[d].memoryLog[id]={id,attempts:a,correctCount:c,lastCorrect:last,lastAt:now};
 setMem(2,'p01-k1',3,1,true);setMem(2,'p01-k2',2,1,false);setMem(2,'p09-k1',3,1,false);setMem(3,'p04-k1',2,1,false);setMem(4,'p06-k2',2,1,true);S[2].termLog={'복벽주의':{opens:3,lastAt:now},'공화주의':{opens:2,lastAt:now},'삼권 분립':{opens:2,lastAt:now}};
 return S;
}
function hasStudy(S){return Object.values(S).some(s=>(s.attempts||[]).length||Object.keys(s.memoryLog||{}).length)}
function adaptiveScore(p,S){const s=S[p.day]||{},ps=(s.problemStatus||{})[p.problemId]||{},ats=(s.attempts||[]).filter(a=>a.problemId===p.problemId),wn=(s.wrongNotes||{})[p.problemId],logs=p.day?Object.values(s.memoryLog||{}).filter(x=>x.problemId===p.problemId):[];let score=0,reasons=[];if(ps.status==='repair'){score+=18;reasons.push('복구 중')}if(ats.length&&!ats.some(a=>a.correct))score+=8;const wc=Math.max(ps.wrongCount||0,wn?.wrongCount||0,ats.filter(a=>!a.correct).length);if(wc){score+=Math.min(20,wc*5);reasons.push(`오답 ${wc}회`)}if(wn&&wn.status!=='learned'){score+=10;reasons.push('오답노트')}const dep=depthCode(ps.lastDepth||wn?.depth||[...ats].reverse().find(a=>!a.correct)?.depth||'');score+=({D0:8,D1:7,D2:6,D3:4,D4:3,D5:2}[dep]||0);if(dep)reasons.push(DNAME[dep]);let memHard=0;for(const m of logs){if(m.lastCorrect===false){score+=5;memHard++}if((m.attempts||0)>(m.correctCount||0))score+=2}if(memHard)reasons.push('키워드 회상');return {...p,score,reasons:[...new Set(reasons)]}}
function analyze(S){
 const attempts=[],mems=[],wrongNotes=[],termLogs=[];for(let d=1;d<=6;d++){const s=S[d]||{};(s.attempts||[]).forEach(x=>attempts.push({day:d,...x}));Object.values(s.memoryLog||{}).forEach(x=>mems.push({day:d,...x}));Object.values(s.wrongNotes||{}).forEach(x=>wrongNotes.push({day:d,...x}));Object.entries(s.termLog||{}).forEach(([term,x])=>termLogs.push({day:d,term,...x}))}
 const correct=attempts.filter(a=>a.correct).length, accuracy=attempts.length?Math.round(correct/attempts.length*100):0;
 const depth={D0:0,D1:0,D2:0,D3:0,D4:0,D5:0};attempts.filter(a=>!a.correct).forEach(a=>{const d=depthCode(a.depth);if(d)depth[d]++});
 const weakMem=mems.filter(m=>m.lastCorrect===false||(m.attempts||0)>(m.correctCount||0));
 const memRate=mems.length?Math.round(mems.filter(m=>m.lastCorrect).length/mems.length*100):100;
 const scores=META.problems.map(p=>adaptiveScore(p,S)).sort((a,b)=>b.score-a.score);
 const weak=scores.filter(x=>x.score>0);
 const branchMap=new Map();weak.forEach(x=>{const k=`Day ${x.day} · ${x.branch||x.conceptTitle}`;const cur=branchMap.get(k)||{name:k,score:0,items:[]};cur.score+=x.score;cur.items.push(x);branchMap.set(k,cur)});const branches=[...branchMap.values()].sort((a,b)=>b.score-a.score);
 // essay risk
 let essayWrong=0,essayItems=[];for(const [key,e] of Object.entries(META.essays)){const s=S[e.day]||{},ats=(s.attempts||[]).filter(a=>a.problemId===e.problemId),wr=ats.filter(a=>!a.correct).length;if(wr){essayWrong+=wr;essayItems.push({...e,wrong:wr})}}
 // term semantics: repeated term-card opens OR glossary-linked memory difficulty. Conservative wording.
 const termScore={};termLogs.forEach(t=>{const k=`d${t.day}:${t.term}`;termScore[k]=(termScore[k]||0)+Math.max(0,(t.opens||0)-1)*2+1});
 for(const m of weakMem){const mm=memMeta(m.day,m.id);if(!mm)continue;for(const [gk,g] of Object.entries(META.glossary)){if(g.day!==m.day)continue;const hay=`${mm.keyword} ${mm.answer} ${mm.link} ${mm.prompt}`;if(hay.includes(g.term))termScore[gk]=(termScore[gk]||0)+((m.lastCorrect===false)?4:2)+Math.max(0,(m.attempts||0)-(m.correctCount||0));}}
 const weakTerms=Object.entries(termScore).map(([k,score])=>({...META.glossary[k],score,opens:(S[META.glossary[k]?.day]?.termLog||{})[META.glossary[k]?.term]?.opens||0})).filter(x=>x.term).sort((a,b)=>b.score-a.score);
 // rote-memory risk: mastered problem but weak memory tied to glossary term
 let roteRisk=0;for(const m of weakMem){const mm=memMeta(m.day,m.id);if(!mm)continue;const ps=(S[m.day]?.problemStatus||{})[mm.problemId];if(ps?.status==='mastered')roteRisk++}
 const completed=Object.values(S).filter(s=>s.finishedAt||s.phase==='done').length;
 return {attempts,correct,accuracy,depth,mems,weakMem,memRate,wrongNotes,scores,weak,branches,essayWrong,essayItems,weakTerms,roteRisk,completed};
}
function sentence(A){const pats=[];const dep=Object.entries(A.depth).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]);if(dep[0])pats.push(DNAME[dep[0][0]]);if(A.weakMem.length>=2)pats.push('핵심어 회상');if(A.essayWrong>=2)pats.push('서술형 답 구성');if(A.weakTerms.length>=2)pats.push('용어 의미 연결');if(!pats.length)return '현재 기록에서는 뚜렷하게 반복되는 약점이 아직 보이지 않습니다.';return `${pats.slice(0,2).join('과 ')}에서 반복 신호가 보입니다. 다음 복습은 이 두 축을 먼저 짧게 회상한 뒤 원문 문제로 확인하는 편이 효율적입니다.`}
function patterns(A){const arr=[];for(const [d,n] of Object.entries(A.depth))if(n)arr.push({name:DNAME[d],n,kind:n>=3?'hot':'warn',text:`관련 오답 ${n}회. 같은 유형에서 다시 틀리는지 확인합니다.`});if(A.weakMem.length)arr.push({name:'핵심어 회상',n:A.weakMem.length,kind:'purple',text:`입력에서 한 번 이상 막힌 핵심어 ${A.weakMem.length}개. 보기 인식보다 직접 회상이 약한 신호입니다.`});if(A.essayWrong)arr.push({name:'서술형 답 구성',n:A.essayWrong,kind:'warn',text:`서술형·단답형 오답 ${A.essayWrong}회. 단체명·시대·공통점 등 채점 요소를 따로 회상해야 합니다.`});if(A.weakTerms.length)arr.push({name:'용어 의미 연결 점검',n:A.weakTerms.length,kind:'purple',text:'용어 카드 반복 열람 또는 관련 핵심어 재입력 기록이 있습니다. 글자 암기와 뜻 이해를 연결할 필요가 있습니다.'});if(A.roteRisk)arr.push({name:'정답 후 회상 불안정',n:A.roteRisk,kind:'hot',text:'원문 문제는 맞혔지만 관련 핵심어 입력에서 반복 실패한 기록입니다. 추측 정답 또는 표면 암기 가능성을 다시 점검합니다.'});return arr.sort((a,b)=>b.n-a.n)}
function weakKeywords(A){return A.weakMem.map(m=>{const mm=memMeta(m.day,m.id);return mm?{...mm,attempts:m.attempts||0,lastCorrect:m.lastCorrect}:null}).filter(Boolean).sort((a,b)=>(b.attempts-a.attempts)).slice(0,8)}
function buildPlan(A){const top=A.weak.slice(0,8).map(x=>x.uid);return {createdAt:Date.now(),version:1,items:top,source:'parent-diagnostic'}}
function savePlan(A){const plan=buildPlan(A);localStorage.setItem(PLAN_KEY,JSON.stringify(plan));location.href=META.adaptiveApp+'?plan=1'}
function renderReport(S,demo=false){const A=analyze(S);if(!hasStudy(S)&&!demo){app.innerHTML=`<main class="wrap"><div class="empty"><h2>아직 분석할 학습 기록이 없습니다.</h2><p class="sub">Day 1부터 실제 문제를 풀면 오답·키워드 회상·서술형 기록을 자동으로 모읍니다.</p><div class="actions" style="justify-content:center"><a class="btn primary" href="${META.hub}">학습 허브로</a><button class="btn" id="demoBtn">샘플 리포트 보기</button></div></div></main>`;document.getElementById('demoBtn').onclick=()=>renderReport(demoStates(),true);return}
 const pats=patterns(A), kws=weakKeywords(A), maxB=Math.max(1,...A.branches.slice(0,6).map(b=>b.score)), maxD=Math.max(1,...Object.values(A.depth));
 app.innerHTML=`<main class="wrap"><div class="top"><div><h1>학습 진단 리포트</h1><div class="sub">대단원 I · Day 1~6 학습 기록 기반${demo?' · 샘플 데이터':''}</div></div><div class="actions"><a class="btn" href="${META.hub}">학습 허브</a><button class="btn" onclick="window.print()">인쇄</button><button class="btn blue" id="planBtn">취약 문제 복습</button></div></div>
 <div class="grid4"><div class="kpi"><span class="lab">총 풀이</span><b>${A.attempts.length}</b><small>누적 시도</small></div><div class="kpi"><span class="lab">정답률</span><b>${A.accuracy}%</b><small>시도 기준</small></div><div class="kpi"><span class="lab">오답 문항</span><b>${A.wrongNotes.length}</b><small>오답노트 등록</small></div><div class="kpi"><span class="lab">키워드 회상</span><b>${A.memRate}%</b><small>최근 입력 성공률</small></div></div>
 <section class="hero"><div class="ey">이번 학습에서 먼저 볼 것</div><h2>${esc(sentence(A))}</h2><p>진단은 학생의 능력을 고정적으로 평가하지 않습니다. 실제 오답, 입력 실패, 재도전 기록에서 반복된 학습 행동만 표시합니다.</p></section>
 <div class="two"><section class="section"><h2>취약 가지</h2><div class="desc">오답 횟수·복구 상태·진단 뎁스·키워드 회상을 합산했습니다.</div><div class="weaklist">${A.branches.slice(0,6).map((b,i)=>`<div class="weak"><div class="rank">${i+1}</div><div><b>${esc(b.name)}</b><small>${b.items.slice(0,3).map(x=>x.conceptTitle).join(' · ')}</small></div><div class="score">${b.score}</div></div>`).join('')||'<p class="sub">현재 뚜렷한 취약 가지가 없습니다.</p>'}</div></section>
 <section class="section"><h2>오답 뎁스</h2><div class="desc">어디서 막혔는지 단계별로 봅니다.</div>${Object.entries(A.depth).map(([d,n])=>`<div class="barrow"><div class="barname">${esc(DNAME[d])}</div><div class="bar"><i class="${n>=3?'hot':''}" style="width:${Math.round(n/maxD*100)}%"></i></div><div class="count">${n}</div></div>`).join('')}</section></div>
 <section class="section"><h2>반복되는 학습 패턴</h2><div class="desc">점수보다 “왜 다시 틀리는가”를 우선합니다.</div><div class="patterns">${pats.slice(0,6).map(p=>`<div class="pattern ${p.kind}"><div class="tag">관찰 ${p.n}건</div><h3>${esc(p.name)}</h3><p>${esc(p.text)}</p></div>`).join('')||'<div class="pattern ok"><h3>반복 약점 없음</h3><p>현재 기록에서는 같은 원인의 오답이 반복되지 않았습니다.</p></div>'}</div></section>
 <div class="two"><section class="section"><h2>직접 회상이 약한 핵심어</h2><div class="desc">문제를 보고 알아보는 것과, 아무것도 없이 떠올리는 것은 다릅니다.</div><table class="memoryTable"><thead><tr><th>핵심어</th><th>질문</th><th>시도</th><th>최근</th></tr></thead><tbody>${kws.map(k=>`<tr><td><b>${esc(k.keyword)}</b><div class="pill">Day ${k.day}</div></td><td>${esc(k.prompt)}</td><td>${k.attempts}</td><td><span class="pill ${k.lastCorrect?'ok':'hot'}">${k.lastCorrect?'성공':'다시 확인'}</span></td></tr>`).join('')||'<tr><td colspan="4">반복 입력이 필요한 핵심어가 없습니다.</td></tr>'}</tbody></table></section>
 <section class="section"><h2>뜻까지 다시 볼 용어</h2><div class="desc">용어 카드 반복 열람과 관련 키워드 입력 기록을 함께 봅니다.</div><div class="terms">${A.weakTerms.slice(0,12).map(t=>`<span class="term">${esc(t.term)}</span>`).join('')||'<span class="sub">현재 강한 신호가 없습니다.</span>'}</div><p class="note">이 항목은 “뜻을 모른다”고 단정하지 않습니다. 용어 설명을 여러 번 열었거나, 같은 용어와 연결된 핵심어 입력에서 반복적으로 막힌 경우를 우선 표시합니다.</p></section></div>
 <section class="section"><h2>다음 3회 학습 처방</h2><div class="desc">학생 화면에는 한 번에 한 과제만 제시하는 것을 권장합니다.</div><div class="plan"><div class="planCard"><div class="n">1회차 · 10~15분</div><h3>가장 약한 가지 원문 문제</h3><ul>${A.weak.slice(0,3).map(x=>`<li>Day ${x.day} · ${esc(x.title)}</li>`).join('')||'<li>적응형 복습 3문항</li>'}</ul></div><div class="planCard"><div class="n">2회차 · 5~10분</div><h3>핵심어 직접 회상</h3><ul>${kws.slice(0,5).map(x=>`<li>${esc(x.keyword)}</li>`).join('')||'<li>오답노트 핵심어 5개</li>'}</ul></div><div class="planCard"><div class="n">3회차 · 10분</div><h3>서술형·용어 의미 연결</h3><ul>${A.essayItems.slice(0,2).map(x=>`<li>${esc(x.title)}</li>`).join('')}${A.weakTerms.slice(0,3).map(x=>`<li>${esc(x.term)} 뜻 설명</li>`).join('')||'<li>중요 용어 3개를 자기 말로 설명</li>'}</ul></div></div></section>
 <div class="footer"><button class="btn primary" id="planBtn2">이 순서로 적응형 복습 시작</button><a class="btn" href="${META.adaptiveApp}">자동 복습으로 이동</a></div><p class="note">용어 + 카드 열람 횟수는 이번 버전부터 Day 2~6에서 기록됩니다. 기존 학습 기록은 그대로 유지되며, 새 로그가 쌓일수록 용어 의미 진단의 근거가 더 정확해집니다.</p></main>`;
 const go=()=>savePlan(A);document.getElementById('planBtn').onclick=go;document.getElementById('planBtn2').onclick=go;
}
function gate(){if(sessionStorage.getItem('history2-parent-diagnostic-unlocked')==='1'){renderReport(allStates());return}app.innerHTML=`<div class="gate"><h2>학부모 진단</h2><p class="sub">학생 학습 기록을 분석하는 화면입니다.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn primary" id="unlock" style="width:100%">진단 화면 열기</button><div id="msg" class="note"></div></div>`;const run=()=>{if(document.getElementById('pin').value===PARENT_PIN){sessionStorage.setItem('history2-parent-diagnostic-unlocked','1');renderReport(allStates())}else document.getElementById('msg').textContent='PIN을 확인하세요.'};document.getElementById('unlock').onclick=run;document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')run()}}
if(new URLSearchParams(location.search).get('demo')==='1')renderReport(demoStates(),true);else gate();
