<script>
const META=JSON.parse(document.getElementById('flowMeta').textContent);const DAY=86400000;const PARENT_PIN='2007';const FLOW_SESSION='history2-unit1-focus-flow-session-v1';const FLOW_ENTRY_POLICY_KEY='history2-unit1-flow-entry-policy-v2';
function migrateFlowEntryPolicy(){try{const raw=localStorage.getItem(FLOW_ENTRY_POLICY_KEY),v=raw?JSON.parse(raw):null;if(!v||Number(v.version)!==2){let keepResume=false;try{const t=JSON.parse(localStorage.getItem('history2-unit1-resume-token-v1')||'null');keepResume=Number(t?.entryPolicyVersion)===2}catch(_){}if(!keepResume){localStorage.removeItem('history2-unit1-resume-token-v1');sessionStorage.removeItem('history2-unit1-resume-defer-v1')}localStorage.setItem(FLOW_ENTRY_POLICY_KEY,JSON.stringify({version:2,migratedAt:Date.now(),policy:'unfinished-day-first'}))}}catch(e){try{localStorage.setItem(FLOW_ENTRY_POLICY_KEY,JSON.stringify({version:2,migratedAt:Date.now(),policy:'unfinished-day-first'}))}catch(_){}}}
migrateFlowEntryPolicy();
let phase='hero',queue=[],idx=0,tries=0,msg='',showAnswer=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function state(day){try{return JSON.parse(localStorage.getItem(META.storage[String(day)])||'{}')}catch(e){return {}}}
function completed(day){const s=state(day);return !!(s.finishedAt||s.phase==='done')}
function nextDay(){for(let d=1;d<=6;d++)if(!completed(d))return d;return null}
function studiedDays(){let n=0;for(let d=1;d<=6;d++)if(completed(d))n++;return n}
function currentProgress(){const d=nextDay();if(!d)return 100;const s=state(d),count=Object.keys(s.problemStatus||{}).filter(k=>s.problemStatus[k]?.status==='mastered').length;const totals={1:14,2:21,3:31,4:26,5:23,6:25};return Math.min(99,Math.round(((d-1)+(count/(totals[d]||1)))/6*100))}
function logFor(x){return (state(x.day).memoryLog||{})[x.id]||null}
function intervalDays(log){if(!log||!log.lastCorrect)return 0;const a=Math.max(1,log.attempts||1),c=Math.max(0,log.correctCount||0),r=c/a;if(a<=1)return 1;if(r<.7)return 1;if(a<=3)return 3;return 7}
function dueData(){const now=Date.now(),out=[];for(const x of META.memory){const l=logFor(x);if(!l||!l.lastAt)continue;const due=l.lastAt+intervalDays(l)*DAY;if(due<=now)out.push({...x,due,log:l})}return out.sort((a,b)=>a.due-b.due||((a.log.correctCount||0)/(a.log.attempts||1))-((b.log.correctCount||0)/(b.log.attempts||1)))}
function nextDueText(){let soon=Infinity;for(const x of META.memory){const l=logFor(x);if(!l||!l.lastAt)continue;const due=l.lastAt+intervalDays(l)*DAY;if(due>Date.now()&&due<soon)soon=due}if(!isFinite(soon))return '';const days=Math.max(1,Math.ceil((soon-Date.now())/DAY));return `${days}일 뒤 다시 확인`;}
function heroData(){const d=nextDay(),due=dueData();if(d){const s=state(d),continuing=!!(s.phase&&s.phase!=='intro');return {ey:`DAY ${d}`,title:'오늘은 하나만.',target:META.titles[String(d)],hint:continuing?'저장된 원문 문제부터 바로 이어갑니다.':'큰 지도를 한 번 보고 원문 문제로 갑니다.',button:continuing?'이어하기':'시작'}}if(due.length)return {ey:'복습',title:'오늘은 짧게.',target:`기억 ${Math.min(5,due.length)}개만 확인`,hint:'새 진도를 모두 마친 뒤에만 간격 회상을 진행합니다.',button:'복습 시작'};return {ey:'완료',title:'오늘은 끝.',target:'지금은 다시 볼 것이 없습니다.',hint:nextDueText(),button:'확인'}}
function renderTop(){return `<div class="top"><b>한국사Ⅱ</b><button class="parent" id="parentBtn">보호자</button></div><div class="progress"><i style="width:${currentProgress()}%"></i></div>`}
function renderHero(){const h=heroData();return `${renderTop()}<main class="center"><section class="hero"><div class="ey">${esc(h.ey)}</div><h1>${esc(h.title)}</h1><div class="target">${esc(h.target)}</div><p class="hint">${esc(h.hint)}</p><button class="cta" id="mainCta">${esc(h.button)}</button></section></main>`}
function startFlow(){const d=nextDay();idx=0;tries=0;msg='';showAnswer=false;queue=[];if(d){goDay(d);return}const due=dueData();queue=due.slice(0,5);if(queue.length){phase='review';render()}else{phase='done';render()}}
function goDay(d){const ret='korean_history2_unit1_student_metacog_flow.html';const u=new URL(META.apps[String(d)],location.href);u.searchParams.set('flow','1');u.searchParams.set('return',ret);location.href=u.href}
function norm(v){return String(v||'').replace(/[\s·.,()\-_/]/g,'').toLowerCase()}
function accepted(x,v){const n=norm(v);return [x.answer,...(Array.isArray(x.accepted)?x.accepted:[])].some(a=>norm(a)===n)}
function saveReview(x,input,correct){const s=state(x.day);s.memoryLog=s.memoryLog||{};const prev=s.memoryLog[x.id]||{id:x.id,problemId:x.problemId,concept:x.conceptId,prompt:x.prompt,answer:x.answer,attempts:0,correctCount:0};prev.attempts=(prev.attempts||0)+1;if(correct)prev.correctCount=(prev.correctCount||0)+1;prev.lastInput=input;prev.lastCorrect=correct;prev.lastAt=Date.now();if(correct)prev.masteredAt=Date.now();s.memoryLog[x.id]=prev;s.reviewAttempts=s.reviewAttempts||[];s.reviewAttempts.push({id:'sp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),checkId:x.id,problemId:x.problemId,input,correct,context:'spacing',at:Date.now()});localStorage.setItem(META.storage[String(x.day)],JSON.stringify(s))}
function renderReview(){const x=queue[idx];if(!x){const d=nextDay();phase=d?'bridge':'done';return d?renderBridge():renderDone()}return `${renderTop()}<main class="center"><section class="micro"><div class="step">기억 ${idx+1} / ${queue.length}</div><h2>${esc(x.prompt)}</h2>${showAnswer?`<div class="flash">${esc(x.answer)}</div><p class="mini">한 번 보고, 다시 직접 입력합니다.</p>`:`<input id="memoryInput" class="memory-input" autocomplete="off" spellcheck="false" placeholder="핵심어 입력">`}<div class="msg ${msg==='맞았습니다.'?'ok':''}">${esc(msg)}</div><button class="cta" id="reviewCta" ${showAnswer?'disabled':''}>입력 확인</button></section></main>`}
function submitReview(){const x=queue[idx],input=document.getElementById('memoryInput')?.value.trim()||'';if(!input)return;const ok=accepted(x,input);saveReview(x,input,ok);if(ok){msg='맞았습니다.';render();setTimeout(()=>{idx++;tries=0;msg='';showAnswer=false;render()},650);return}tries++;if(tries===1){msg=x.hint?`힌트 · ${x.hint}`:'한 번 더 떠올려 보세요.';render()}else{msg='';showAnswer=true;render();setTimeout(()=>{showAnswer=false;msg='같은 답을 직접 입력하세요.';render()},1500)}}
function renderBridge(){const d=nextDay();return `${renderTop()}<main class="center"><section class="hero"><div class="ey">복습 완료</div><div class="doneword">연결 완료</div><div class="target">${esc(META.titles[String(d)])}</div><p class="hint">이제 오늘 문제만 이어갑니다.</p><button class="cta" id="goDay">문제 시작</button></section></main>`}
function renderDone(){return `${renderTop()}<main class="center"><section class="hero"><div class="ey">오늘 완료</div><div class="doneword">끝</div><div class="target">오늘 할 분량을 마쳤습니다.</div><p class="hint">${esc(nextDueText())}</p></section></main>`}
function parentDialog(){return `<div class="dialog" id="dialog"><section class="gate"><h3>보호자 모드</h3><p>학생 화면과 분리된 진단·복습 일정 화면입니다.</p><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><div class="gate-row"><button class="secondary" id="cancelGate">취소</button><button class="cta" id="openParent" style="min-height:54px;font-size:16px">열기</button></div><div id="gateMsg" class="msg"></div></section></div>`}
function bind(){document.getElementById('parentBtn')?.addEventListener('click',()=>{document.body.insertAdjacentHTML('beforeend',parentDialog());document.getElementById('pin').focus();const run=()=>{if(document.getElementById('pin').value===PARENT_PIN){sessionStorage.setItem('history2-parent-mode-unlocked','1');location.href='korean_history2_unit1_parent_mode_metacog.html';}else document.getElementById('gateMsg').textContent='PIN을 확인하세요.'};document.getElementById('openParent').onclick=run;document.getElementById('pin').onkeydown=e=>{if(e.key==='Enter')run()};document.getElementById('cancelGate').onclick=()=>document.getElementById('dialog').remove()});document.getElementById('mainCta')?.addEventListener('click',startFlow);document.getElementById('reviewCta')?.addEventListener('click',submitReview);const inp=document.getElementById('memoryInput');if(inp){setTimeout(()=>inp.focus(),80);inp.onkeydown=e=>{if(e.key==='Enter')submitReview()}}document.getElementById('goDay')?.addEventListener('click',()=>goDay(nextDay()))}
function render(){document.getElementById('app').innerHTML=phase==='hero'?renderHero():phase==='review'?renderReview():phase==='bridge'?renderBridge():renderDone();bind()}
if(new URLSearchParams(location.search).get('resume')==='1')phase='hero';render();
</script><script src="flow_guard_engine.js"></script><script src="flow_guard_hub_addon.js"></script>
