<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>한국사Ⅱ 빠른 학습</title>
  <meta name="color-scheme" content="light">
  <style>
    :root{--ink:#102946;--muted:#60748b;--line:#d8e3ec;--soft:#f5f8fb;--navy:#102b4c;--green:#0b765c;--green-soft:#e9f7f1;--red:#b42318;--red-soft:#fff2f0;--blue:#1d6fb8;--blue-soft:#eef7ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fa;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}#app{min-height:100dvh}.shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:16px;padding:18px clamp(16px,3vw,44px) 22px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:18px}.kicker{font-size:14px;font-weight:900;color:#55708f;letter-spacing:.02em}.title{margin:4px 0 0;font-size:clamp(25px,3.2vw,42px);line-height:1.15;letter-spacing:-.035em}.progress{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-weight:850;color:#47627f}.progress b{font-size:24px;color:var(--navy)}
    .card{width:min(1120px,100%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 36px rgba(16,43,76,.07);padding:clamp(18px,3vw,34px)}
    .intro-card{display:grid;gap:22px}.intro-lead{font-size:clamp(21px,2.4vw,32px);line-height:1.35;font-weight:950;letter-spacing:-.025em}.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.branch{border:1px solid #cad9e6;background:var(--soft);border-radius:16px;padding:14px 16px;font-weight:900;line-height:1.35}.branch em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-bottom:4px}.intro-note{font-size:15px;color:var(--muted);font-weight:750}.primary{width:min(520px,100%);justify-self:center;border:0;border-radius:16px;background:var(--navy);color:#fff;min-height:58px;padding:0 24px;font-weight:950;font-size:19px;cursor:pointer}.primary:hover{filter:brightness(1.06)}
    .question-card{display:grid;gap:18px}.qmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);font-weight:850}.concept{display:inline-flex;align-items:center;gap:7px;background:var(--blue-soft);color:#1b5f98;border-radius:999px;padding:7px 11px}.qtext{font-size:clamp(22px,2.6vw,34px);line-height:1.42;font-weight:950;letter-spacing:-.025em;word-break:keep-all}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:17px;padding:15px 18px;min-height:58px;display:flex;align-items:flex-start;gap:12px;color:var(--ink);font-weight:850;line-height:1.45;cursor:pointer}.choice:hover{border-color:#8eb7d4;background:#f8fcff}.choice .n{flex:0 0 auto;width:28px;height:28px;border-radius:10px;background:#eef3f7;display:grid;place-items:center;font-weight:950;color:#47627f}.choice.correct{border-color:#5bb28f;background:var(--green-soft)}.choice.wrong{border-color:#e69d95;background:var(--red-soft)}
    .feedback{display:grid;gap:10px;border-radius:16px;padding:15px 17px;font-weight:850;line-height:1.45}.feedback.good{background:var(--green-soft);color:#135f4b}.feedback.bad{background:var(--red-soft);color:#89281f}.feedback strong{font-size:18px}.next{justify-self:end;border:0;border-radius:14px;background:var(--navy);color:#fff;min-height:50px;padding:0 22px;font-weight:950;cursor:pointer}
    .repair-card{display:grid;gap:17px}.repair-title{font-size:14px;font-weight:900;color:var(--red)}.path{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.path span{background:#eef3f7;border-radius:999px;padding:7px 10px;font-size:14px;font-weight:900}.path i{font-style:normal;color:#8798a9}.clue{font-size:clamp(20px,2.1vw,28px);line-height:1.5;font-weight:950;word-break:keep-all}.judge{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}.judge-label{font-size:14px;font-weight:900;color:var(--muted)}.judge-statement{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:15px 17px;font-size:clamp(18px,2vw,24px);line-height:1.45;font-weight:900;word-break:keep-all}.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ox button{border:2px solid var(--line);background:#fff;border-radius:17px;min-height:66px;font-size:18px;font-weight:950;cursor:pointer}.ox button strong{font-size:31px;margin-right:8px}.ox .o strong{color:var(--green)}.ox .x strong{color:var(--red)}.ox button:hover{border-color:#8eb7d4;background:#f8fcff}.repair-help{font-size:15px;color:var(--red);font-weight:850}.correction{background:#fff8e8;border:1px solid #efd69e;border-radius:15px;padding:13px 15px;font-weight:900;line-height:1.45}
    .done-card{display:grid;gap:20px;text-align:center}.done-title{font-size:clamp(28px,4vw,48px);font-weight:1000}.score{font-size:18px;color:var(--muted);font-weight:850}.weak{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.weak span{border-radius:999px;background:#fff3ef;color:#8b3129;padding:8px 12px;font-weight:900}.small{border:0;background:transparent;color:#73869a;font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.foot{display:flex;justify-content:center;min-height:26px;color:#8493a3;font-size:12px;font-weight:750}
    @media(max-width:720px){.shell{padding:12px}.top{align-items:flex-start}.progress{padding:8px 10px}.progress b{font-size:20px}.card{border-radius:19px}.ox button{min-height:58px}.branches{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script src="fast_day_engine.js"></script>
</body>
</html>
