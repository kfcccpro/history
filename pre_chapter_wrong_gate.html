<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한국사Ⅱ · 이전 오답 관문</title>
<meta name="color-scheme" content="light">
<style>
:root{--ink:#102946;--muted:#60748b;--line:#d8e3ec;--soft:#f5f8fb;--navy:#102b4c;--green:#0b765c;--green-soft:#e9f7f1;--blue:#1d6fb8;--blue-soft:#eef7ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fa;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}#app{min-height:100dvh}.shell{min-height:100dvh;padding:24px clamp(16px,4vw,54px);display:grid;place-items:center}.card{width:min(1180px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(24px,4vw,52px);box-shadow:0 14px 42px rgba(16,43,76,.07)}.kicker{font-size:18px;font-weight:1000;color:var(--blue)}h1{margin:8px 0 0;font-size:clamp(34px,4.5vw,58px);line-height:1.2;letter-spacing:-.04em}.lead{margin-top:15px;font-size:clamp(20px,2vw,26px);line-height:1.55;font-weight:850;color:var(--muted);word-break:keep-all}.rule{margin-top:22px;padding:18px 20px;border-radius:18px;background:#fff7e8;border:1px solid #efd69e;font-size:19px;line-height:1.55;font-weight:900;color:#735420}.progress{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.slot{min-height:108px;border:2px solid #dfe8ef;border-radius:18px;background:var(--soft);padding:16px;display:grid;align-content:center;gap:5px}.slot b{font-size:21px}.slot span{font-size:15px;color:var(--muted);font-weight:850}.slot.done{border-color:#9bd2bd;background:var(--green-soft)}.slot.now{border-color:#78afd3;background:var(--blue-soft)}.actions{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px}.primary{min-height:72px;border:0;border-radius:18px;background:var(--navy);color:#fff;padding:0 26px;font-size:22px;font-weight:1000;cursor:pointer}.secondary{min-height:72px;border:1px solid var(--line);border-radius:18px;background:#fff;color:#536b82;padding:0 22px;font-weight:900;cursor:pointer}.note{margin-top:15px;font-size:15px;color:#8191a1;font-weight:800;text-align:center}@media(max-width:720px){.shell{padding:12px}.card{padding:24px 17px}.progress{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.primary,.secondary{min-height:62px}.lead{font-size:19px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="app_mode_config.js"></script>
<script src="firebase_config.js"></script>
<script src="sync_local_hook.js"></script>
<script src="firebase_sync_engine.js"></script>
<script src="pre_chapter_wrong_gate.js"></script>
</body>
</html>
