<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고1 한국사 시험직전 취약점 강화 웹앱</title>
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="한국사 시험직전">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root{
      --bg:#f6f4ef; --panel:#ffffff; --ink:#151515; --muted:#666; --line:#e6dfd4;
      --brand:#1f5eff; --brand2:#163eb0; --ok:#1f8a4c; --bad:#d23b3b; --warn:#d98200;
      --soft:#eef3ff; --soft2:#fff8e8; --shadow:0 10px 30px rgba(0,0,0,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#f8f6f1,#f0ede6);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.48}
    button,input,select,textarea{font:inherit}
    button,.choice,.mode{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    body{padding-bottom:env(safe-area-inset-bottom)}
    .app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
    aside{position:sticky;top:0;height:100vh;padding:22px;background:#111827;color:#fff;overflow:auto}
    .logo{font-size:22px;font-weight:900;letter-spacing:-.03em;margin:4px 0 8px}
    .sub{color:#cbd5e1;font-size:13px;margin-bottom:18px}
    .nav{display:grid;gap:8px;margin:18px 0}
    .nav button{width:100%;text-align:left;border:0;border-radius:14px;padding:12px 13px;color:#dbeafe;background:transparent;cursor:pointer}
    .nav button:hover,.nav button.active{background:#25324b;color:#fff}
    .sidecard{background:#1f2937;border:1px solid #374151;border-radius:18px;padding:14px;margin:14px 0}
    .sidecard b{display:block;margin-bottom:7px}
    .tiny{font-size:12px;color:#94a3b8}
    main{padding:24px;max-width:1260px;width:100%;margin:0 auto}
    .topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
    .title h1{font-size:28px;margin:0 0 4px;letter-spacing:-.04em}
    .title p{margin:0;color:var(--muted)}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#333}
    .grid{display:grid;gap:16px}
    .grid.cards{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
    .stat{font-size:30px;font-weight:900;letter-spacing:-.04em}
    .statlabel{font-size:13px;color:var(--muted)}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}
    .hero .card:first-child{background:linear-gradient(135deg,#ffffff,#edf3ff)}
    h2{font-size:22px;margin:0 0 12px;letter-spacing:-.03em}
    h3{font-size:17px;margin:22px 0 10px}
    .btn{border:0;background:var(--brand);color:#fff;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;min-height:44px}
    .btn:hover{background:var(--brand2)}
    .btn.secondary{background:#fff;color:#1f2937;border:1px solid var(--line)}
    .btn.secondary:hover{background:#f3f4f6}
    .btn.ghost{background:transparent;color:#1f2937;border:1px dashed var(--line)}
    .btn.danger{background:var(--bad)}
    .btn.ok{background:var(--ok)}
    .btn.warn{background:var(--warn)}
    .btn.small{padding:9px 12px;border-radius:10px;font-size:13px;min-height:40px}
    select,input[type="number"],input[type="text"],textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none}
    select:focus,input:focus,textarea:focus{border-color:#8aa7ff;box-shadow:0 0 0 3px rgba(31,94,255,.12)}
    .mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .mode{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;cursor:pointer;text-align:left}
    .mode:hover{border-color:#9db4ff;background:#f8fbff}
    .mode b{display:block;margin-bottom:6px}
    .mode span{color:var(--muted);font-size:13px}
    .question-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
    .qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#f3f4f6;color:#374151}
    .badge.hot{background:#fff0e0;color:#9a4b00}
    .badge.weak{background:#ffe8e8;color:#9c1a1a}
    .badge.good{background:#e7f8ed;color:#146c39}
    .question{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:10px 0 18px;white-space:pre-wrap}
    .choices{display:grid;gap:10px}
    .choice{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px;cursor:pointer;transition:.12s;min-height:52px}
    .choice:hover{border-color:#9db4ff;background:#f8fbff}
    .choice.selected{border-color:var(--brand);background:#eef3ff}
    .choice.correct{border-color:var(--ok);background:#e7f8ed}
    .choice.wrong{border-color:var(--bad);background:#ffecec}
    .feedback{border-radius:18px;padding:16px;margin-top:16px;background:#f8fafc;border:1px solid var(--line)}
    .feedback.ok{background:#edfdf3;border-color:#c8ecd6}
    .feedback.bad{background:#fff1f1;border-color:#ffd0d0}
    .answer-line{font-weight:900;margin:0 0 8px}
    .progressbar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
    .progressbar > div{height:100%;background:var(--brand);border-radius:999px;transition:.25s}
    .list{display:grid;gap:10px}
    .row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}
    .row .main{font-weight:800}
    .row .desc{color:var(--muted);font-size:13px;margin-top:2px}
    .bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;min-width:110px}
    .bar span{display:block;height:100%;background:var(--brand)}
    .weak-list .row{align-items:flex-start}
    .note-view{max-height:72vh;overflow:auto;padding:22px;background:#fff;border-radius:var(--radius);border:1px solid var(--line)}
    .note-view h1{font-size:24px;margin:12px 0}
    .note-view h2{font-size:20px;margin:24px 0 10px;border-top:1px solid var(--line);padding-top:18px}
    .note-view h3{font-size:17px;margin:18px 0 8px}
    .note-view table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0;display:block;overflow:auto}
    .note-view th,.note-view td{border:1px solid #ddd;padding:7px 8px;vertical-align:top}
    .note-view th{background:#f5f5f5}
    .note-view blockquote{border-left:4px solid #9db4ff;margin:10px 0;padding:8px 12px;background:#f8fbff;color:#374151}
    .note-view code{background:#f2f2f2;border-radius:6px;padding:1px 5px}
    .flashcard{min-height:280px;display:grid;place-items:center;text-align:center;border:2px dashed #cbd5e1;background:linear-gradient(135deg,#fff,#f8fbff);border-radius:22px;padding:24px;cursor:pointer}
    .flash-front{font-size:24px;font-weight:900;white-space:pre-wrap}
    .flash-back{font-size:18px;white-space:pre-wrap}
    .anki-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
    .order-pool,.order-answer{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;padding:12px;border:1px dashed var(--line);border-radius:16px;background:#fafafa;margin:10px 0}
    .order-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer}
    .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:7px;padding:1px 6px}
    .hidden{display:none!important}
    .footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
    .toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:9;opacity:0;transform:translateY(10px);transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:980px){
      .app{grid-template-columns:1fr}
      aside{position:static;height:auto}
      .hero,.question-wrap{grid-template-columns:1fr}
      .grid.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
      .mode-grid{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      main{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
      .grid.cards{grid-template-columns:1fr}
      .question{font-size:19px}
      .controls{width:100%}
      .controls .pill,.controls select,.controls button{flex:1 1 100%}
      aside{padding:16px}
      .anki-buttons{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">한국사 시험직전</div>
    <div class="sub">문제로 외우고, 틀린 건 강제로 반복하는 취약점 강화 앱</div>
    <div class="nav" id="nav"></div>
    <div class="sidecard">
      <b>오늘 학습</b>
      <div class="tiny" id="sideToday">0문항 · 0분</div>
      <div class="progressbar" style="margin-top:10px"><div id="sideProgress" style="width:0%"></div></div>
    </div>
    <div class="sidecard">
      <b>즉시 복습 대상</b>
      <div class="tiny" id="sideDue">0개 카드</div>
    </div>
    <div class="tiny">데이터는 IndexedDB에 우선 저장되고, localStorage에 백업됩니다. <span id="storageBadge">저장소 확인 중</span></div>
  </aside>
  <main>
    <div class="topbar">
      <div class="title">
        <h1 id="pageTitle">대시보드</h1>
        <p id="pageDesc">시험 직전용 강화 반복 학습을 시작하세요.</p>
      </div>
      <div class="controls">
        <span class="pill">목표 <input id="targetInput" type="number" min="5" max="300" step="5" style="width:72px"> 문항</span>
        <select id="unitFilter"></select>
        <button class="btn secondary small" id="quickWeak">취약점 시작</button>
        <button class="btn small" id="quickExam">시험직전</button>
      </div>
    </div>
    <div id="view"></div>
    <div class="footer">고1 한국사 핵심정리 기반 · PWA/패드 최적화 · IndexedDB 자동 저장</div>
  </main>
</div>
<div class="toast" id="toast"></div>

const DATA = {"title": "고1 한국사 시험직전 취약점 강화 웹앱", "version": "1.0.0", "notesMd": "# 고1 한국사 시험대비 핵심 정리\n\n> 정리 기준: 업로드된 한국사 스캔 자료의 **인쇄된 본문·표·연표·사료·기출형 문제 형식**을 중심으로 재구성하였다. 빈 페이지, 낙서, 손글씨 보충, 풀이 흔적, 이름/학번란 등은 학습 대상에서 제외하였다.  \n> 활용 목적: 이후 웹앱에서 **중요도·기출 유형 중심 문제 출제**가 가능하도록 단원-흐름-핵심키워드-출제포인트 구조로 정리하였다.\n\n---\n\n## 0. 전체 시험 범위 분류표\n\n| 대분류 | 핵심 흐름 | 중요도 | 자주 나오는 기출 형태 | 출제용 핵심 키워드 |\n|---|---|---:|---|---|\n| 역사 학습의 의미 | 역사 = 사실 + 해석, 사료 비판, 진실 추구 | ★★☆ | 개념 판단, 사례 적용 | 사료, 해석, 증거, 진실 |\n| 선사 문화와 고조선 | 구석기→신석기→청동기→철기, 고조선 성립·발전·멸망 | ★★★★★ | 시대 구분, 도구·경제·사회 비교, 사료 연결 | 뗀석기, 빗살무늬 토기, 비파형 동검, 8조법 |\n| 여러 나라의 성장 | 부여·고구려·옥저·동예·삼한 비교 | ★★★★★ | 나라별 풍속·제천행사·정치 구조 비교 | 영고, 동맹, 민며느리제, 무천, 제정분리 |\n| 삼국과 가야 | 고구려·백제·신라·가야의 성장과 경쟁, 한강 유역 | ★★★★★ | 왕 업적 순서, 지도·연표, 한강 유역 장악 | 태조왕, 고국천왕, 근초고왕, 진흥왕, 금관가야 |\n| 통일신라와 발해 | 신라의 삼국 통일, 통치체제, 발해 성장 | ★★★★ | 통일 과정 순서, 남북국 비교 | 매소성, 기벌포, 9주 5소경, 3성 6부 |\n| 고대 사회·경제·문화 | 신분제, 수취, 불교·유학·도교·풍수지리 | ★★★★ | 자료 해석형, 문화재 연결 | 골품제, 관등제, 녹읍, 원효, 의상, 선종 |\n| 고려 정치 변동 | 후삼국 통일→통치 체제 정비→문벌→무신→몽골→공민왕 | ★★★★★ | 사건 순서, 왕 업적, 제도 설명 | 태조, 광종, 성종, 2성 6부, 전시과, 음서 |\n| 고려 대외 관계 | 거란·여진·몽골·원 간섭기·공민왕 개혁 | ★★★★★ | 침입 순서, 인물·전투 연결 | 서희, 강감찬, 윤관, 삼별초, 쌍성총관부 |\n| 고려 사회·경제·문화 | 귀족 사회, 수취·상업, 불교·유학·인쇄문화 | ★★★★ | 제도 비교, 문화재·사료 연결 | 공음전, 벽란도, 팔만대장경, 직지, 삼국사기 |\n| 조선 전기 | 건국, 유교 정치, 통치 조직, 사림 성장 | ★★★★ | 왕 업적, 제도 비교, 사화·붕당 원인 | 정도전, 의정부, 6조, 3사, 경국대전, 사림 |\n| 조선 후기 | 양난 이후 수취 개편, 상품화폐경제, 신분제 동요, 실학 | ★★★★ | 제도 개혁 비교, 사회 변화 자료형 | 대동법, 균역법, 영정법, 공인, 실학, 세도정치 |\n| 근대 국가 수립 노력 | 개항→개화정책→위정척사→임오군란→갑신정변→동학→갑오·을미 | ★★★★★ | 연표 순서, 자료·사료형, 개혁 내용 비교 | 강화도 조약, 통리기무아문, 갑신정변, 전주화약, 홍범 14조 |\n| 대한제국과 광무개혁 | 독립협회, 대한제국 선포, 광무개혁 | ★★★★★ | 단체 활동, 황제권 강화, 지계 자료 | 독립문, 만민공동회, 대한국 국제, 원수부, 지계 |\n| 경제·사회·문화 변동 | 열강 경제 침탈, 상권 수호, 근대 문물·언론·교육·국학 | ★★★★ | 조약문·신문·지도 자료 해석 | 조청상민수륙무역장정, 방곡령, 황국중앙총상회, 독립신문 |\n| 국권 침탈과 수호 운동 | 러일전쟁→을사늑약→정미7조약→병합, 의병·애국계몽 | ★★★★★ | 국권 침탈 순서, 의병 단계, 단체 비교 | 한일의정서, 을사늑약, 헤이그 특사, 13도 창의군, 신민회 |\n\n---\n\n# 1. 역사 학습의 의미\n\n## 시험 흐름\n역사는 단순 암기가 아니라 **과거 사실을 증거로 확인하고, 현재의 관점에서 의미를 해석하는 과정**이다. 같은 사건도 자료 선택과 관점에 따라 다르게 해석될 수 있으므로, 사료의 성격과 한계를 파악하는 문제가 출제된다.\n\n## 핵심 내용\n- 역사적 사실은 **증거, 사료, 기록, 유물·유적**을 바탕으로 확인한다.\n- 역사 해석은 기록자의 관점, 시대 상황, 가치 판단에 따라 달라질 수 있다.\n- 역사 학습의 목표는 과거를 통해 현재를 이해하고 미래의 판단력을 기르는 것이다.\n- 사료는 작성 주체, 목적, 시기, 내용의 신뢰성을 함께 따져야 한다.\n\n## 기출 포인트\n- `사실`과 `해석` 구분 문제\n- 같은 사건을 다르게 보도한 자료의 이유 찾기\n- 유물·유적을 통해 과거 생활을 추론하는 문제\n- “역사는 과거와 현재의 대화”라는 관점 이해\n\n---\n\n# 2. 선사 문화의 전개와 고대 국가의 형성\n\n## 2-1. 구석기·신석기·청동기·철기 비교\n\n| 구분 | 구석기 | 신석기 | 청동기 | 철기 |\n|---|---|---|---|---|\n| 시기 | 약 70만 년 전부터 | 약 1만 년 전부터 | 기원전 2000~1500년경 | 기원전 5세기경 이후 |\n| 대표 도구 | 뗀석기 | 간석기, 빗살무늬 토기, 가락바퀴, 뼈바늘 | 비파형 동검, 청동 거울, 민무늬 토기 | 철제 농기구·무기, 세형동검, 거푸집 |\n| 경제 | 사냥·채집, 불과 언어 사용 | 농경과 목축 시작 | 벼농사, 농경 발달, 사유재산 발생 | 철제 농기구로 농업 생산력 증가 |\n| 주거 | 이동 생활, 동굴·막집 | 강가·바닷가 움집, 정착 생활 | 배산임수 지역, 움집 | 국가·연맹체 성장 기반 |\n| 사회 | 평등 사회 | 씨족·부족 사회, 족외혼 | 빈부 격차, 계급 발생, 군장 등장 | 정복 전쟁 확대, 국가 성장 |\n| 신앙·예술 | 사냥 성공 기원 | 애니미즘, 샤머니즘, 토테미즘 | 고인돌, 돌널무덤, 바위그림 | 중국과 교류 확대 |\n\n## 고득점 암기 흐름\n`구석기 이동·평등 → 신석기 농경·정착 → 청동기 계급·군장·고조선 → 철기 연맹왕국·정복전쟁`\n\n## 기출 포인트\n- **도구-시대 연결**: 빗살무늬 토기=신석기, 비파형 동검=청동기, 세형동검=철기\n- **사회 변화**: 농경 시작은 신석기, 계급 발생은 청동기\n- **유물 자료형**: 고인돌·비파형 동검·민무늬 토기 → 청동기 권력자·군장 사회\n\n---\n\n## 2-2. 고조선\n\n## 시험 흐름\n고조선은 청동기 문화를 바탕으로 성립한 우리 역사상 최초의 국가이다. 단군 신화, 위만 조선, 한 군현 설치까지의 흐름이 중요하다.\n\n## 핵심 내용\n- 건국: 청동기 문화 기반, 단군왕검, 제정일치 사회 반영\n- 단군 신화: 천손 의식, 홍익인간, 농경 사회, 지배 계급 출현을 보여 줌\n- 성장: 랴오닝 지방과 한반도 서북부 중심, 비파형 동검·탁자식 고인돌 분포와 관련\n- 위만 조선: 위만이 준왕을 몰아내고 왕위 차지, 철기 문화 본격 수용, 중계무역 발달\n- 멸망: 한 무제 침입 → 왕검성 함락 → 한 군현 설치\n- 사회: 8조법을 통해 생명·노동력·사유재산 중시, 계급 사회 확인\n\n## 기출 포인트\n- 단군 신화의 의미: `천손 의식`, `제정일치`, `농경`, `지배층`\n- 위만 조선 특징: `철기 수용`, `중계무역`, `한과 대립`\n- 8조법 해석: 살인·상해·도둑질 처벌 → 사유재산, 계급, 노동력 중시\n\n---\n\n## 2-3. 부여·고구려·옥저·동예·삼한 비교\n\n| 나라 | 정치 구조 | 경제·사회 | 풍속·제천행사 | 빈출 키워드 |\n|---|---|---|---|---|\n| 부여 | 왕 아래 마가·우가·저가·구가, 사출도 | 반농반목, 순장, 형사취수제 | 영고, 1책 12법 | 연맹체, 사출도, 영고 |\n| 고구려 | 제가회의, 5부 | 약탈 경제, 서옥제 | 동맹, 10월 | 제가회의, 서옥제, 동맹 |\n| 옥저 | 왕 없음, 군장 통치 | 해산물 풍부, 고구려에 공납 | 민며느리제, 가족공동묘 | 민며느리제, 공납 |\n| 동예 | 왕 없음, 읍군·삼로 | 단궁·과하마·반어피 | 무천, 책화, 족외혼 | 책화, 무천 |\n| 삼한 | 제정분리, 신지·읍차와 천군 | 벼농사, 철 생산·수출 | 수릿날·계절제, 소도 | 소도, 천군, 철 |\n\n## 고득점 암기 흐름\n`부여=사출도·영고 / 고구려=제가회의·동맹 / 옥저=민며느리제 / 동예=책화·무천 / 삼한=소도·천군·철`\n\n## 기출 포인트\n- 풍속 연결형 문제가 매우 자주 출제된다.\n- “왕이 없고 군장이 통치”는 옥저·동예, “제정분리”는 삼한이다.\n- 삼한의 소도는 정치 지배자의 힘이 미치지 않는 신성 지역이다.\n\n---\n\n# 3. 삼국과 가야의 성장과 경쟁\n\n## 3-1. 고구려\n\n## 핵심 흐름\n`건국 → 태조왕 성장 → 고국천왕 왕위 부자 상속·진대법 → 미천왕 낙랑 점령 → 고국원왕 위기 → 소수림왕 체제 정비 → 광개토대왕 영토 확장 → 장수왕 남진 정책`\n\n| 왕 | 핵심 업적 | 출제 포인트 |\n|---|---|---|\n| 태조왕 | 옥저 복속, 계루부 고씨 왕위 독점 | 고구려 성장 시작 |\n| 고국천왕 | 왕위 부자 상속, 5부 개편, 진대법 | 중앙 집권 강화 |\n| 미천왕 | 낙랑군 축출 | 대동강 유역 확보 |\n| 고국원왕 | 백제 근초고왕 침입으로 전사 | 고구려 위기 |\n| 소수림왕 | 불교 수용, 태학 설립, 율령 반포 | 체제 정비 3종 세트 |\n| 광개토대왕 | 만주 장악, 신라 지원, 왜 격퇴 | 광개토대왕릉비 |\n| 장수왕 | 평양 천도, 남진 정책, 한강 유역 차지 | 남진 정책, 충주 고구려비 |\n\n## 기출 포인트\n- 소수림왕 = `불교·태학·율령`\n- 광개토대왕 = `정복 활동`, 장수왕 = `평양 천도·남진`\n- 한강 유역 장악 순서: `백제 → 고구려 → 신라`\n\n---\n\n## 3-2. 백제\n\n## 핵심 흐름\n`고이왕 체제 정비 → 근초고왕 전성기 → 침류왕 불교 수용 → 개로왕 한성 함락 → 문주왕 웅진 천도 → 무령왕 지방 통제 강화 → 성왕 사비 천도·남부여`\n\n| 왕 | 핵심 업적 | 출제 포인트 |\n|---|---|---|\n| 고이왕 | 관등제 정비, 율령 반포, 한강 유역 장악 | 중앙 집권 기틀 |\n| 근초고왕 | 마한 통합, 고구려 공격, 해외 진출 | 백제 전성기 |\n| 침류왕 | 불교 수용 | 사상 수용 |\n| 개로왕 | 고구려 장수왕 공격으로 한성 함락 | 웅진 천도 배경 |\n| 무령왕 | 지방 22담로 파견, 중국 남조 교류 | 무령왕릉 |\n| 성왕 | 사비 천도, 남부여, 관산성 전투 전사 | 백제 중흥 시도 |\n\n## 기출 포인트\n- 근초고왕은 백제 전성기의 대표 왕이다.\n- 성왕은 사비 천도와 남부여 국호, 신라와의 관계 변화가 함께 출제된다.\n\n---\n\n## 3-3. 신라\n\n## 핵심 흐름\n`박혁거세 건국 → 내물왕 김씨 왕위 세습·마립간 → 지증왕 국호 신라·우산국 복속 → 법흥왕 율령·불교·금관가야 병합 → 진흥왕 한강 유역 장악·대가야 정복`\n\n| 왕 | 핵심 업적 | 출제 포인트 |\n|---|---|---|\n| 내물왕 | 김씨 왕위 세습, 마립간 칭호 | 신라 중앙 집권 시작 |\n| 지증왕 | 국호 신라, 왕 칭호, 우산국 복속 | 지증왕=국호·우산국 |\n| 법흥왕 | 율령 반포, 불교 공인, 금관가야 병합 | 체제 정비 |\n| 진흥왕 | 화랑도 정비, 한강 유역 차지, 대가야 정복 | 순수비, 신라 전성기 |\n\n## 기출 포인트\n- 법흥왕과 진흥왕 업적 구분이 핵심이다.\n- 진흥왕은 한강 유역을 차지하고 순수비를 세웠다.\n\n---\n\n## 3-4. 가야\n\n## 핵심 내용\n- 건국: 김수로 설화, 금관가야 중심\n- 전기 가야: 금관가야 중심, 철 생산과 중계무역 발달\n- 쇠퇴: 고구려 광개토대왕의 공격 이후 금관가야 약화\n- 후기 가야: 대가야 중심, 철 생산 지속, 신라 진흥왕 때 멸망\n- 특징: 중앙집권적 고대 국가로 완전히 성장하지 못하고 연맹체 단계에서 소멸\n\n## 기출 포인트\n- `철 생산`, `중계무역`, `금관가야→대가야`, `신라에 병합`이 핵심이다.\n\n---\n\n## 3-5. 삼국 통일 과정\n\n## 핵심 흐름\n1. 고구려와 수의 전쟁: 을지문덕, 살수대첩\n2. 고구려와 당의 전쟁: 연개소문, 안시성 전투\n3. 나당 연합 결성\n4. 백제 멸망: 황산벌 전투, 사비성 함락\n5. 고구려 멸망: 평양성 함락\n6. 나당 전쟁: 매소성·기벌포 승리\n7. 삼국 통일 완성\n\n## 기출 포인트\n- 통일 과정은 **순서형 문제**로 매우 자주 출제된다.\n- 백제 부흥운동: 복신, 도침, 흑치상지, 왜 지원, 백강 전투\n- 고구려 부흥운동: 검모잠, 안승, 고연무\n- 신라 통일의 의의: 민족 문화 형성 계기\n- 한계: 대동강 이남에 한정, 외세인 당의 군사력 이용\n\n---\n\n# 4. 통일신라와 발해\n\n## 4-1. 통일신라\n\n## 핵심 내용\n- 무열왕: 최초의 진골 출신 왕, 삼국 통일 주도\n- 문무왕: 삼국 통일 완성, 왕권 강화\n- 신문왕: 김흠돌의 난 진압, 관료전 지급, 녹읍 폐지, 9주 5소경 정비, 국학 설립\n- 통치 체제: 중앙 14부, 지방 9주 5소경, 군사 9서당 10정\n- 말기: 진골 귀족의 왕위 다툼, 지방 호족 성장, 6두품 개혁 주장, 후삼국 성립\n\n## 기출 포인트\n- 신문왕 업적은 통일신라 체제 정비의 핵심이다.\n- `관료전 지급·녹읍 폐지`는 왕권 강화 정책이다.\n- 9주 5소경은 지방 통제와 수도 편중 보완을 위한 제도이다.\n\n---\n\n## 4-2. 발해\n\n## 핵심 흐름\n`대조영 건국 → 무왕 영토 확장·당 공격 → 문왕 당과 친선·상경 천도 → 선왕 해동성국 → 거란 침입으로 멸망`\n\n| 왕 | 핵심 업적 | 출제 포인트 |\n|---|---|---|\n| 대조영 | 고구려 유민과 말갈족을 이끌고 건국 | 고구려 계승 의식 |\n| 무왕 | 흑수말갈 제압, 당 산둥 공격 | 대외 팽창 |\n| 문왕 | 당과 친선, 3성 6부제 수용, 상경 천도 | 제도 정비 |\n| 선왕 | 요동 진출, 해동성국 | 전성기 |\n\n## 통일신라와 발해 비교\n\n| 구분 | 통일신라 | 발해 |\n|---|---|---|\n| 시기 | 남쪽 한반도 중심 | 만주와 한반도 북부 중심 |\n| 정치 | 9주 5소경, 9서당 10정 | 3성 6부, 5경 15부 62주 |\n| 성격 | 삼국 통일 후 중앙집권 강화 | 고구려 계승, 당 제도 수용 |\n| 문화 | 불교문화, 석굴암·불국사 | 고구려 문화 기반+당 문화 수용 |\n\n## 기출 포인트\n- 남북국 시대의 성격과 발해의 고구려 계승성이 자주 출제된다.\n- 발해의 3성 6부는 당 제도를 수용했지만 명칭과 운영에는 독자성이 있었다.\n\n---\n\n# 5. 고대의 사회·경제·문화\n\n## 5-1. 신분제와 사회 구조\n\n## 핵심 내용\n- 청동기 이후 잉여 생산물과 전쟁 증가로 계급이 발생하였다.\n- 삼국 시대에는 왕족·귀족·관인층·평민·천민이 존재하였다.\n- 신라 골품제는 혈통에 따라 정치적 진출과 일상생활을 제한한 폐쇄적 신분제였다.\n- 통일신라 말에는 6두품과 호족이 새로운 세력으로 성장하였다.\n\n## 기출 포인트\n- 골품제의 특징: 관등 승진 제한, 관직 진출 제한, 생활 규제\n- 6두품: 신라 말 개혁 요구, 고려 건국에 참여\n\n## 5-2. 경제생활\n- 조세: 토지 생산물 일부 수취\n- 공납: 지역 특산물 납부\n- 역: 노동력 제공\n- 고대 국가는 전쟁 포로와 피정복민에게 조세·노동력을 부과하였다.\n- 통일신라에서는 관료전 지급, 녹읍 폐지·부활 등이 왕권과 귀족 세력의 관계를 보여 준다.\n\n## 5-3. 사상과 문화\n\n| 분야 | 핵심 내용 | 기출 포인트 |\n|---|---|---|\n| 천신 신앙 | 하늘 숭배, 왕권 신성화 | 단군 신화, 제천행사 |\n| 유학 | 통치 이념과 교육 제도 | 태학, 국학, 임신서기석 |\n| 불교 | 왕권 강화, 귀족 중심 문화, 대중화 | 소수림왕·침류왕·법흥왕, 원효·의상 |\n| 도교 | 불로장생·신선 사상 | 고구려 고분 벽화, 백제 산수무늬 벽돌 |\n| 풍수지리 | 지리 조건 중시 | 신라 말 호족 성장과 연결 |\n| 국제 교류 | 중국·서역 문화 수용, 일본 전파 | 아스카 문화, 하쿠호 문화 영향 |\n\n---\n\n# 6. 고려의 통치 체제와 정치 변동\n\n## 6-1. 고려의 건국과 후삼국 통일\n\n## 핵심 흐름\n`신라 말 왕권 약화·호족 성장 → 후백제·후고구려 성립 → 왕건의 고려 건국 → 후삼국 통일`\n\n## 태조 왕건 정책\n- 민생 안정: 세금 감면, 흑창 설치\n- 호족 통합: 혼인 정책, 사성 정책\n- 북진 정책: 서경 중시, 고구려 계승 의식\n- 훈요 10조: 후대 왕에게 남긴 정치 지침\n\n## 기출 포인트\n- 태조 정책은 `민생 안정·호족 포섭·북진 정책`으로 묶어 기억한다.\n\n---\n\n## 6-2. 고려 통치 체제 정비\n\n| 왕 | 핵심 업적 | 기출 포인트 |\n|---|---|---|\n| 태조 | 후삼국 통일, 호족 포섭, 북진 정책 | 건국 기반 |\n| 광종 | 노비안검법, 과거제, 공복 제정 | 왕권 강화 |\n| 성종 | 최승로 시무 28조, 2성 6부, 12목, 향리제 | 유교 정치 질서 |\n\n## 중앙 정치 조직\n- 2성: 중서문하성, 상서성\n- 6부: 이·병·호·형·예·공\n- 중추원: 군사 기밀과 왕명 출납\n- 어사대: 관리 감찰\n- 삼사: 회계 담당\n- 도병마사·식목도감: 고려의 독자적 회의 기구\n\n## 지방 제도\n- 5도 양계: 일반 행정 구역과 군사 행정 구역 구분\n- 주현과 속현: 지방관이 파견된 주현, 파견되지 않은 속현\n- 향·부곡·소: 특수 행정 구역, 차별 대우\n- 향리: 지방 행정 실무 담당\n\n## 관리 선발\n- 과거제: 광종 때 실시, 유교적 능력 중시\n- 음서제: 공신·고위 관리 자손의 관직 진출, 귀족 사회 특징\n\n## 기출 포인트\n- 광종과 성종 업적 구분\n- 도병마사·식목도감은 고려의 독자성\n- 5도 양계와 향·부곡·소의 성격\n\n---\n\n## 6-3. 문벌 사회와 무신 정권\n\n## 문벌 사회\n- 여러 대에 걸쳐 고위 관리를 배출한 가문이 권력 독점\n- 과거와 음서를 통해 권력 유지\n- 공음전 등 경제적 기반 보유\n- 이자겸의 난, 묘청의 서경 천도 운동으로 모순 표출\n\n## 무신 정권\n- 배경: 문신 중심 정치, 무신 차별\n- 정중부 등 무신정변 발생\n- 최씨 무신정권: 교정도감, 정방, 도방, 삼별초 등 설치\n- 농민·천민 봉기 증가: 망이·망소이의 난, 만적의 난 등\n\n## 기출 포인트\n- 묘청의 서경 천도 운동: 서경 세력, 풍수지리, 금 정벌 주장\n- 만적의 난: 신분 해방 지향, 천민 봉기의 대표 사례\n- 최씨 정권 기구: 교정도감=최고 권력 기구, 정방=인사권 장악\n\n---\n\n## 6-4. 고려의 대외 관계\n\n| 상대 | 흐름 | 핵심 인물·사건 | 기출 포인트 |\n|---|---|---|---|\n| 거란 | 1차·2차·3차 침입 | 서희 외교 담판, 강감찬 귀주대첩 | 강동 6주, 귀주대첩 |\n| 여진 | 여진 성장, 고려 공격 | 윤관 별무반, 동북 9성 | 동북 9성 반환 이유 |\n| 몽골 | 6차례 침입, 강화도 천도 | 처인성 전투, 팔만대장경, 삼별초 | 항쟁과 피해, 원 간섭기 |\n| 원 | 내정 간섭 | 쌍성총관부, 정동행성, 권문세족 | 관제 격하, 공민왕 개혁 배경 |\n| 공민왕 | 반원 자주 개혁 | 쌍성총관부 수복, 정동행성 이문소 폐지, 전민변정도감 | 신진 사대부 성장 |\n\n## 기출 포인트\n- 거란 침입 순서: `서희 외교 → 양규 활약 → 강감찬 귀주대첩`\n- 몽골 침입: 강화도 천도, 팔만대장경 조판, 삼별초 항쟁\n- 원 간섭기: 왕실 호칭·관제 격하, 공녀, 권문세족 성장\n- 공민왕 개혁: 반원 자주 정책 + 권문세족 억압\n\n---\n\n## 6-5. 고려 사회·경제·문화\n\n## 경제\n- 전시과: 관리에게 수조권 지급\n- 공음전: 5품 이상 관리에게 지급, 세습 가능 → 귀족 사회 특징\n- 조세·공납·역 부과\n- 벽란도: 국제 무역항, 송·아라비아 상인 왕래\n- 화폐: 건원중보, 삼한통보, 해동통보 등 발행 시도\n\n## 사회\n- 귀족, 중류층, 양민, 천민으로 구성\n- 여성의 지위가 조선보다 상대적으로 높음: 균분 상속, 재가 가능, 사위와 외손도 음서 혜택 가능\n\n## 문화\n| 분야 | 핵심 내용 | 기출 포인트 |\n|---|---|---|\n| 유교 | 국자감, 사학 12도, 향교 | 최충, 유교 교육 |\n| 역사서 | 김부식 『삼국사기』, 일연 『삼국유사』, 이승휴 『제왕운기』 | 유교적 합리주의 vs 민족 의식 |\n| 불교 | 의천 천태종, 지눌 조계종 | 교관겸수, 정혜쌍수·돈오점수 |\n| 인쇄 | 초조대장경, 팔만대장경, 직지 | 몽골 침입과 팔만대장경 |\n| 공예 | 고려청자, 상감청자 | 귀족 문화 |\n\n---\n\n# 7. 조선의 건국과 통치 체제\n\n## 7-1. 조선 건국\n\n## 핵심 흐름\n`권문세족의 폐단 → 신진 사대부 성장 → 위화도 회군 → 과전법 실시 → 조선 건국`\n\n## 핵심 내용\n- 이성계와 신진 사대부가 조선을 건국하였다.\n- 정도전은 재상 중심 정치를 주장하였다.\n- 한양 천도, 유교 이념 기반 국가 운영이 이루어졌다.\n\n## 기출 포인트\n- 고려 말 신진 사대부와 신흥 무인 세력의 결합\n- 과전법은 신진 사대부의 경제 기반 마련과 권문세족 약화에 기여\n\n---\n\n## 7-2. 조선 전기 통치 제도\n\n| 왕 | 핵심 업적 | 기출 포인트 |\n|---|---|---|\n| 태종 | 6조 직계제, 사병 혁파, 호패법 | 왕권 강화 |\n| 세종 | 의정부 서사제, 집현전, 훈민정음, 과학기술 | 민본 정치 |\n| 세조 | 6조 직계제, 집현전 폐지 | 왕권 강화 |\n| 성종 | 경국대전 완성, 홍문관 설치 | 통치 체제 완비 |\n\n## 중앙 정치 조직\n- 의정부: 최고 정책 심의 기구\n- 6조: 행정 실무 담당\n- 3사: 사헌부·사간원·홍문관, 언론과 감찰 담당\n- 승정원: 왕명 출납\n- 의금부: 왕명에 따른 특별 사법 기관\n\n## 지방·군사·교육\n- 전국 8도, 관찰사 파견\n- 수령은 행정·군사·사법 담당\n- 유향소: 지방 사족의 향촌 자치 기구\n- 성균관·향교·서원에서 유교 교육\n\n## 기출 포인트\n- 3사는 왕권 견제와 관리 감찰 기능\n- 경국대전은 조선의 기본 법전\n- 태종·세조는 왕권 강화, 세종·성종은 제도 정비 이미지가 강하다.\n\n---\n\n## 7-3. 사림의 성장과 붕당\n\n## 핵심 흐름\n`훈구의 권력 독점 → 사림의 중앙 진출 → 사화 → 서원·향약 기반 확대 → 붕당 형성`\n\n## 핵심 내용\n- 훈구: 조선 건국과 왕권 강화 과정에서 공을 세운 세력\n- 사림: 지방에서 성리학을 바탕으로 성장한 세력\n- 사화: 훈구와 사림의 갈등으로 사림이 피해를 입은 사건\n- 붕당: 선조 때 동인과 서인으로 분화\n\n## 기출 포인트\n- 사림의 기반: 서원, 향약\n- 사화와 붕당은 원인과 결과의 흐름으로 출제된다.\n\n---\n\n## 7-4. 임진왜란과 병자호란\n\n## 임진왜란\n- 일본 도요토미 히데요시의 침략\n- 이순신의 수군 활약, 의병 활동, 명의 지원\n- 결과: 국토 황폐화, 문화재 약탈, 조선·명·일본 모두에 큰 영향\n\n## 병자호란\n- 후금·청의 성장, 조선의 친명배금 정책\n- 청 침입, 남한산성 항전, 삼전도 굴욕\n- 결과: 청과 군신 관계, 북벌론 대두\n\n## 기출 포인트\n- 임진왜란은 의병·수군·명군, 병자호란은 청과의 관계 변화가 핵심이다.\n\n---\n\n## 7-5. 조선 후기 사회·경제 변화\n\n## 수취 체제 개편\n| 제도 | 내용 | 기출 포인트 |\n|---|---|---|\n| 영정법 | 전세를 토지 1결당 4~6두로 고정 | 전세 개편 |\n| 대동법 | 공납을 토지 결수에 따라 쌀·베·동전으로 납부 | 공인 등장, 상품화폐경제 발달 |\n| 균역법 | 군포를 1년에 1필로 감면 | 군역 부담 완화 |\n\n## 사회 변화\n- 농업 생산력 증가, 상품 작물 재배 확대\n- 장시 발달, 사상 성장, 공인·도고 활동\n- 신분제 동요: 공명첩, 납속책, 노비 감소\n- 서민 문화 발달: 한글 소설, 판소리, 탈춤, 민화\n- 실학: 현실 문제 해결, 농업·상공업·국학 연구\n- 세도 정치와 삼정 문란 → 홍경래의 난, 임술 농민 봉기\n\n## 기출 포인트\n- 대동법은 공납 개혁이면서 상품화폐경제 발달과 연결된다.\n- 실학은 중농학파·중상학파·국학 연구로 구분된다.\n- 세도정치의 폐단은 삼정 문란과 농민 봉기로 연결된다.\n\n---\n\n# 8. 근대 국가 수립을 위한 노력\n\n## 8-1. 흥선 대원군과 개항\n\n## 흥선 대원군 정책\n- 왕권 강화: 비변사 기능 축소·폐지, 의정부와 삼군부 기능 회복\n- 민생 안정: 서원 정리, 호포제 실시, 사창제 실시\n- 통상 수교 거부: 병인양요, 신미양요 이후 척화비 건립\n- 한계: 경복궁 중건에 따른 백성 부담 증가\n\n## 개항 과정\n| 사건 | 시기 | 핵심 내용 |\n|---|---|---|\n| 병인양요 | 1866 | 병인박해를 구실로 프랑스 침입, 외규장각 도서 약탈 |\n| 신미양요 | 1871 | 제너럴셔먼호 사건을 구실로 미국 침입 |\n| 운요호 사건 | 1875 | 일본 군함의 도발, 강화도 조약의 배경 |\n| 강화도 조약 | 1876 | 조선 최초의 근대적 조약, 불평등 조약 |\n\n## 강화도 조약 포인트\n- 조선은 자주국이라는 표현: 청의 간섭 배제 목적\n- 부산 외 2개 항구 개항\n- 해안 측량권과 영사 재판권 인정\n- 일본의 경제 침투 기반 마련\n\n## 기출 포인트\n- 강화도 조약은 `근대적 조약`이지만 `불평등 조약`이다.\n- 병인양요·신미양요·운요호 사건·강화도 조약의 순서가 중요하다.\n\n---\n\n## 8-2. 개화 정책과 위정척사 운동\n\n## 개화 정책\n- 통리기무아문 설치: 개화 정책 총괄 기구\n- 별기군 창설: 신식 군대\n- 5군영을 2영으로 개편\n- 조사시찰단: 일본 파견\n- 영선사: 청 파견, 근대 무기 제조 기술 습득\n- 보빙사: 미국 파견\n\n## 위정척사 운동\n| 시기 | 주장 | 대표 흐름 |\n|---|---|---|\n| 1860년대 | 서양과 통상 반대 | 병인양요·신미양요 전후 |\n| 1870년대 | 개항 반대 | 강화도 조약 반대, 왜양일체론 |\n| 1880년대 | 개화 정책 반대 | 영남 만인소, 조선책략 반대 |\n| 1890년대 이후 | 항일 의병 운동으로 연결 | 을미의병 등 |\n\n## 기출 포인트\n- 개화 정책은 정부 주도 근대화, 위정척사는 성리학적 질서 수호와 외세 배척이다.\n- 조사시찰단·영선사·보빙사의 파견국과 목적 구분이 중요하다.\n\n---\n\n## 8-3. 임오군란과 갑신정변\n\n## 임오군란(1882)\n- 배경: 구식 군인 차별, 개화 정책에 따른 불만, 도시 하층민 불만\n- 전개: 구식 군인 봉기, 별기군 일본인 교관 살해, 일본 공사관 공격\n- 결과: 청군 개입, 흥선 대원군 청으로 압송, 제물포 조약 체결, 조청상민수륙무역장정 체결\n- 의미: 청의 내정 간섭 심화, 일본의 배상금·공사관 경비병 주둔 허용\n\n## 갑신정변(1884)\n- 주도: 김옥균·박영효 등 급진 개화파\n- 배경: 청의 내정 간섭, 급진 개화파의 개혁 추진, 일본 지원 약속\n- 전개: 우정총국 개국 축하연 이용, 개화당 정부 수립, 14개조 개혁안 발표\n- 결과: 청군 개입으로 3일 만에 실패, 한성 조약, 톈진 조약\n- 한계: 민중 지지 부족, 일본 군사력 의존\n\n## 갑신정변 14개조 핵심 방향\n- 청에 대한 사대 관계 폐지\n- 문벌 폐지와 인민 평등권 지향\n- 지조법 개혁\n- 재정 일원화\n- 내각 중심 정치 추구\n\n## 기출 포인트\n- 임오군란 결과 = 청 간섭 강화 + 제물포 조약 + 조청상민수륙무역장정\n- 갑신정변 결과 = 한성 조약 + 톈진 조약\n- 갑신정변은 위로부터의 급진 개혁이지만 민중 지지 부족과 일본 의존이 한계이다.\n\n---\n\n## 8-4. 동학 농민 운동\n\n## 배경\n- 농민층의 경제 악화: 조세 부담, 일본 상인의 곡물 유출, 물가 상승\n- 동학의 확산: 인간 평등 사상, 반외세 정서\n- 교조 신원 운동: 동학교도들이 교조 최제우의 억울함을 풀 것을 요구\n\n## 전개\n| 단계 | 핵심 내용 | 기출 포인트 |\n|---|---|---|\n| 고부 농민 봉기 | 조병갑의 횡포, 만석보 사건 | 전봉준 등장 |\n| 1차 봉기 | 백산 봉기, 황토현·황룡촌 전투 승리, 전주성 점령 | 반봉건 성격 |\n| 전주화약 | 정부와 농민군 타협, 집강소 설치 | 폐정개혁안 실천 |\n| 청일전쟁 | 조선 정부의 청군 요청, 일본군 파병 | 동학과 국제 정세 연결 |\n| 2차 봉기 | 일본군 축출 목표, 남접·북접 연합 | 반외세 성격 |\n| 우금치 전투 | 농민군 패배 | 운동 실패 |\n\n## 폐정개혁안 핵심\n- 탐관오리 처벌\n- 노비 문서 소각\n- 천민 차별 개선\n- 청상과부 재가 허용\n- 토지의 평균 분작 요구\n\n## 의의와 한계\n- 의의: 반봉건·반외세 운동, 갑오개혁에 일부 반영\n- 한계: 근대적 무기 부족, 조직력 한계, 일본군 개입으로 실패\n\n## 기출 포인트\n- 1차 봉기=반봉건, 2차 봉기=반외세 성격이 강하다.\n- 전주화약 이후 집강소 설치와 폐정개혁안 실천이 중요하다.\n\n---\n\n## 8-5. 갑오개혁·을미개혁\n\n| 구분 | 시기 | 주요 내용 | 기출 포인트 |\n|---|---|---|---|\n| 제1차 갑오개혁 | 1894 | 군국기무처 설치, 개국 기년 사용, 과거제 폐지, 신분제 폐지, 조세 금납화 | 동학 농민 운동 요구 일부 반영 |\n| 제2차 갑오개혁 | 1894~1895 | 홍범 14조 발표, 8도→23부, 재판소 설치, 교육입국 조서 | 국정 개혁 방향 공식화 |\n| 을미개혁 | 1895 | 태양력 사용, 단발령, 소학교 설치, 우편 사무 재개 | 을미사변·단발령 반발, 을미의병 |\n\n## 갑오·을미개혁의 의의와 한계\n- 의의: 봉건적 통치 체제를 개혁하려 한 근대적 개혁\n- 한계: 일본의 간섭 아래 추진, 민중의 지지를 충분히 얻지 못함\n\n## 기출 포인트\n- 갑오개혁은 신분제·과거제 폐지, 조세 금납화가 핵심이다.\n- 을미개혁은 단발령 때문에 을미의병과 연결된다.\n\n---\n\n## 8-6. 독립협회와 대한제국\n\n## 독립협회\n- 서재필 등 중심, 독립신문 발간\n- 독립문 건립, 독립관에서 토론회 개최\n- 자주 국권 운동: 러시아 절영도 조차 요구 저지, 이권 수호\n- 자유 민권 운동: 국민의 자유와 권리 주장\n- 의회 설립 운동: 관민공동회, 헌의 6조 결의\n- 해산: 보수 관료의 모함과 정부 탄압\n\n## 대한제국과 광무개혁\n- 대한제국 선포: 고종이 황제로 즉위, 자주독립 국가 표방\n- 대한국 국제: 황제권 강화, 전제 군주정 명시\n- 광무개혁: 구본신참 원칙, 원수부 설치, 양전 사업과 지계 발급, 상공업 진흥, 근대 시설 확충\n- 한계: 황제권 중심 개혁, 열강 간섭과 재정 부족으로 제한\n\n## 기출 포인트\n- 독립협회는 자주 국권·자유 민권·의회 설립 운동으로 나누어 기억한다.\n- 광무개혁의 대표 키워드는 `구본신참`, `양전 사업`, `지계`, `원수부`이다.\n\n---\n\n# 9. 사회·경제 변화와 문화 변동\n\n## 9-1. 열강의 경제 침탈\n\n## 핵심 내용\n- 개항 초기: 일본 상인의 무역 활동 증가, 조선의 쌀·콩 등 곡물 유출\n- 임오군란 이후: 조청상민수륙무역장정 체결로 청 상인의 내륙 진출 허용\n- 일본 상인의 경제 침투: 무역 장악, 면제품 수입과 곡물 수출 증가\n- 방곡령: 지방관이 곡물 유출을 막기 위해 실시했으나 일본의 반발과 배상 요구 발생\n- 러시아·일본 등 열강의 이권 침탈: 철도·광산·삼림 채굴권 등 침탈\n- 일본의 재정 장악: 메가타의 화폐 정리 사업, 한국 상공업자 타격\n- 토지 수탈: 동양척식주식회사 설립, 일본인의 토지 소유 확대\n\n## 기출 포인트\n- 조청상민수륙무역장정은 청 상인의 내륙 진출 허용이 핵심이다.\n- 방곡령은 일본으로의 곡물 유출을 막기 위한 조치이다.\n- 화폐 정리 사업은 일본 제일은행권 중심으로 통화 정리, 한국 상인에게 큰 타격을 주었다.\n\n---\n\n## 9-2. 상권 수호와 근대 기업\n\n## 핵심 내용\n- 객주·여각 등 전통 상인의 활동\n- 황국중앙총상회: 시전 상인 중심, 외국 상인의 침투에 대응\n- 상회사 설립: 대동상회, 장통상회 등\n- 대한천일은행: 민족계 은행\n- 운수업과 제조업 등 근대 기업 성장\n\n## 기출 포인트\n- 황국중앙총상회는 독립협회와 함께 상권 수호 운동을 전개하였다.\n- 민족 자본의 성장은 외세 경제 침탈에 대한 대응으로 출제된다.\n\n---\n\n## 9-3. 근대 문물과 생활 변화\n\n| 분야 | 핵심 내용 | 기출 포인트 |\n|---|---|---|\n| 통신 | 전신 도입, 우편 제도 실시 | 근대적 정보 전달 |\n| 전기 | 경복궁 전등, 한성전기회사 | 근대 시설 |\n| 교통 | 철도 부설, 전차 운행 | 일본의 침탈과 근대화 양면성 |\n| 의료 | 광혜원, 제중원 | 서양 의학 도입 |\n| 의식주 | 양복·양장, 서양 음식, 서양식 건축 | 생활문화 변화 |\n| 문예 | 신소설, 창가, 국문 문학 | 국민 의식 확산 |\n\n## 기출 포인트\n- 근대 문물은 편리함을 가져왔지만, 일부는 일본의 경제·군사적 침탈과 연결되었다.\n\n---\n\n## 9-4. 근대 교육·언론·국학·종교\n\n## 교육\n- 원산학사: 근대적 교육 기관\n- 육영공원: 정부가 세운 근대식 학교\n- 배재학당·이화학당: 선교사 설립 학교\n- 교육입국 조서: 근대 교육의 중요성 강조\n- 오산학교·대성학교: 애국 계몽 운동과 연결\n\n## 언론\n- 한성순보: 우리나라 최초의 근대 신문, 순한문\n- 독립신문: 최초의 민간 신문, 한글과 영문 발행\n- 제국신문: 순한글 사용, 서민·부녀자 대상\n- 황성신문: 유림층 대상, 장지연의 「시일야방성대곡」\n- 대한매일신보: 영국인 베델 발행, 국채 보상 운동 지원\n\n## 국학\n- 박은식: 혼 중심 역사 인식\n- 신채호: 민족주의 역사학, 『독사신론』\n- 국문 연구소 설치, 한글 연구 확대\n\n## 종교\n- 동학→천도교: 만민 평등과 민족의식\n- 개신교: 의료·교육 활동\n- 천주교: 신앙의 자유 확대\n- 유교·불교의 근대적 개혁 움직임\n\n## 기출 포인트\n- 신문별 특징 연결 문제가 자주 나온다.\n- `한성순보=최초 근대 신문`, `독립신문=민간·한글/영문`, `황성신문=시일야방성대곡`, `대한매일신보=국채보상운동 지원`.\n\n---\n\n# 10. 국권 침탈과 국권 수호 운동\n\n## 10-1. 일본의 국권 침탈 과정\n\n## 핵심 연표\n| 시기 | 사건 | 핵심 내용 |\n|---|---|---|\n| 1904.2 | 한일의정서 | 일본이 군사상 필요한 지역 사용권 확보 |\n| 1904.8 | 제1차 한일 협약 | 재정 고문 메가타, 외교 고문 스티븐스 파견 |\n| 1905.7 | 가쓰라·태프트 밀약 | 미국은 일본의 한국 지배, 일본은 미국의 필리핀 지배 인정 |\n| 1905.8 | 제2차 영일 동맹 | 영국이 일본의 한국 지배 인정 |\n| 1905.9 | 포츠머스 조약 | 러시아가 일본의 한국 우월권 인정 |\n| 1905.11 | 을사늑약 | 외교권 박탈, 통감부 설치 |\n| 1907 | 헤이그 특사 | 고종의 특사 파견, 일본의 방해로 실패 |\n| 1907 | 고종 강제 퇴위 | 헤이그 특사 파견을 구실로 강제 퇴위 |\n| 1907 | 한일 신협약·정미7조약 | 차관정치, 통감 권한 강화 |\n| 1907 | 군대 해산 | 정미의병 확산 계기 |\n| 1909 | 기유각서 | 사법권 박탈 |\n| 1910 | 경찰권 위임 | 경찰권 박탈 |\n| 1910.8 | 한일 병합 조약 | 국권 상실, 조선총독부 설치 |\n\n## 기출 포인트\n- 국권 침탈은 **순서형**으로 매우 자주 출제된다.\n- 을사늑약의 핵심은 외교권 박탈과 통감부 설치이다.\n- 정미7조약은 차관정치와 군대 해산으로 연결된다.\n\n---\n\n## 10-2. 항일 의병 운동\n\n| 구분 | 시기 | 배경·특징 | 기출 포인트 |\n|---|---|---|---|\n| 을미의병 | 1895 | 을미사변, 단발령에 반발 | 유생 중심, 고종 해산 권고 후 약화 |\n| 을사의병 | 1905 | 을사늑약에 반발 | 신돌석 등 평민 의병장 등장 |\n| 정미의병 | 1907 | 고종 강제 퇴위, 군대 해산 | 해산 군인 합류, 의병 전쟁으로 발전 |\n| 13도 창의군 | 1908 | 전국 의병 연합 | 서울 진공 작전 추진 |\n| 호남 의병 | 1908~1909 | 전라도 일대 중심 | 일본의 남한 대토벌 작전으로 약화 |\n\n## 기출 포인트\n- 을미의병은 단발령, 을사의병은 을사늑약, 정미의병은 군대 해산과 연결한다.\n- 정미의병은 해산 군인의 합류로 전투력이 강화되었다.\n\n---\n\n## 10-3. 애국 계몽 운동과 민족 운동 단체\n\n| 단체 | 시기 | 주요 활동 | 기출 포인트 |\n|---|---|---|---|\n| 보안회 | 1904 | 일본의 황무지 개간권 요구 저지 | 국권 수호 운동 |\n| 헌정연구회 | 1905 | 입헌 정치 연구 | 계몽 운동 |\n| 대한자강회 | 1906 | 교육·산업 진흥, 월보 발행 | 고종 강제 퇴위 반대 후 해산 |\n| 대한협회 | 1907 | 교육·산업 진흥 | 계몽 활동 |\n| 신민회 | 1907 | 비밀 결사, 대성학교·오산학교, 자기회사, 태극서관, 독립군 기지 건설 | 공화정 지향, 105인 사건으로 해산 |\n| 국채보상운동 | 1907 | 국민 성금으로 일본에 진 빚을 갚자는 운동 | 대구 시작, 대한매일신보 지원 |\n\n## 기출 포인트\n- 신민회는 비밀 결사이며 공화정 체제를 지향했다.\n- 국채보상운동은 국민적 경제 주권 수호 운동이다.\n- 애국 계몽 운동은 교육·산업 진흥을 통한 실력 양성이 중심이다.\n\n---\n\n# 11. 최종 암기용 사건 순서\n\n## 고대 국가 형성 흐름\n`구석기 → 신석기 → 청동기 → 고조선 → 철기 여러 나라 → 삼국 성장 → 삼국 항쟁 → 신라의 삼국 통일 → 통일신라·발해`\n\n## 고려 정치 흐름\n`후삼국 → 태조 왕건 → 광종 왕권 강화 → 성종 제도 정비 → 문벌 귀족 사회 → 이자겸의 난 → 묘청의 서경 천도 운동 → 무신정변 → 몽골 침입 → 원 간섭기 → 공민왕 개혁 → 위화도 회군 → 조선 건국`\n\n## 조선 전기 흐름\n`조선 건국 → 태종 왕권 강화 → 세종 문화·제도 정비 → 세조 왕권 강화 → 성종 경국대전 완성 → 사림 성장 → 사화 → 붕당 형성`\n\n## 조선 후기 흐름\n`임진왜란 → 병자호란 → 수취 체제 개편 → 상품화폐경제 발달 → 신분제 동요 → 실학·서민문화 → 세도정치 → 농민 봉기`\n\n## 개항기~국권 침탈 흐름\n`병인양요 → 신미양요 → 운요호 사건 → 강화도 조약 → 통리기무아문 → 임오군란 → 갑신정변 → 동학 농민 운동 → 청일전쟁 → 갑오개혁 → 을미사변·을미개혁 → 아관파천 → 독립협회 → 대한제국 → 러일전쟁 → 을사늑약 → 헤이그 특사 → 정미7조약·군대 해산 → 기유각서 → 경찰권 위임 → 한일 병합`\n\n---\n\n# 12. 웹앱 문제 출제용 메타 데이터\n\n## 12-1. 중요도 등급 기준\n- ★★★★★: 시험 직전 반드시 암기. 순서형·자료형·비교형 출제 가능성이 높음.\n- ★★★★: 핵심 개념 이해 필요. 표·사료·지도와 결합 가능.\n- ★★★: 단독 출제보다는 오답 선지 또는 보조 자료로 활용.\n- ★★ 이하: 개념 확인 또는 서술형 배경 설명용.\n\n## 12-2. 추천 문제 유형\n| 유형 | 설명 | 적합 단원 |\n|---|---|---|\n| 빈칸형 | 핵심 용어 암기 확인 | 전 단원 |\n| OX형 | 헷갈리는 개념 판단 | 선사, 제도, 개혁 내용 |\n| 순서 배열형 | 사건 전개 순서 확인 | 삼국 통일, 고려 대외관계, 근대 연표 |\n| 자료 해석형 | 사료·조약문·개혁안·지도 해석 | 고조선 8조법, 갑신정변, 갑오개혁, 을사늑약 |\n| 비교형 | 시대·국가·제도 차이 비교 | 여러 나라, 삼국, 통일신라/발해, 갑오/을미개혁 |\n| 인물 연결형 | 왕·인물과 업적 연결 | 삼국 왕, 고려 왕, 근대 개화파·의병장 |\n| 오답 선지 찾기 | 유사 개념 혼동 방지 | 전체 단원 |\n\n## 12-3. 출제 우선순위 목록\n\n| 우선순위 | 주제 | 추천 문제 유형 |\n|---:|---|---|\n| 1 | 구석기·신석기·청동기·철기 비교 | 빈칸, 비교형, 자료형 |\n| 2 | 여러 나라 풍속 비교 | 연결형, OX형 |\n| 3 | 삼국 왕 업적과 한강 유역 | 연표형, 인물 연결형 |\n| 4 | 신라 삼국 통일 과정 | 순서 배열형 |\n| 5 | 통일신라와 발해 비교 | 비교형, 자료형 |\n| 6 | 고려 태조·광종·성종 업적 | 인물 연결형 |\n| 7 | 거란·여진·몽골 침입 | 순서형, 자료형 |\n| 8 | 조선 전기 통치 기구 | 빈칸형, 비교형 |\n| 9 | 조선 후기 수취 체제 개편 | 비교형, OX형 |\n| 10 | 강화도 조약과 개항 | 자료 해석형 |\n| 11 | 임오군란·갑신정변 비교 | 비교형, 순서형 |\n| 12 | 동학 농민 운동 전개 | 순서 배열형, 자료형 |\n| 13 | 갑오·을미개혁 내용 | 비교형, 빈칸형 |\n| 14 | 독립협회와 대한제국 | 자료형, 단체 활동 연결형 |\n| 15 | 국권 침탈 과정 | 순서 배열형 |\n| 16 | 의병 운동과 애국 계몽 운동 | 비교형, 단체 연결형 |\n\n## 12-4. 오답 선지 제작용 혼동 포인트\n- 신석기와 청동기 혼동: 농경 시작은 신석기, 계급 발생은 청동기.\n- 비파형 동검과 세형동검 혼동: 비파형은 청동기 고조선, 세형은 철기 문화.\n- 부여·고구려 풍속 혼동: 부여는 영고, 고구려는 동맹.\n- 옥저·동예 혼동: 옥저는 민며느리제, 동예는 책화·무천.\n- 소수림왕·법흥왕 혼동: 고구려 소수림왕은 불교·태학·율령, 신라 법흥왕은 율령·불교·금관가야 병합.\n- 광개토대왕·장수왕 혼동: 광개토대왕은 정복 활동, 장수왕은 평양 천도와 남진 정책.\n- 무왕·문왕·선왕 혼동: 발해 무왕은 당 공격, 문왕은 당 친선·상경 천도, 선왕은 해동성국.\n- 광종·성종 혼동: 광종은 왕권 강화, 성종은 유교적 통치 체제 정비.\n- 도병마사와 식목도감: 고려의 독자적 회의 기구.\n- 강화도 조약: 자주국 표현은 조선 독립 존중이 아니라 청 간섭 배제 목적.\n- 임오군란과 갑신정변: 임오군란은 구식 군인 불만, 갑신정변은 급진 개화파 정변.\n- 갑오개혁과 을미개혁: 갑오개혁은 신분제·과거제 폐지, 을미개혁은 단발령·태양력.\n- 독립협회와 대한제국: 독립협회는 민권·의회 운동, 대한제국은 황제권 강화.\n- 을미·을사·정미의병: 각각 단발령, 을사늑약, 군대 해산과 연결.\n\n---\n\n# 13. 시험 직전 10분 압축 키워드\n\n1. 선사: `뗀석기-간석기-비파형동검-철제농기구`\n2. 고조선: `단군왕검-위만-중계무역-한 군현-8조법`\n3. 여러 나라: `영고-동맹-민며느리제-무천-소도`\n4. 삼국: `소수림왕/근초고왕/법흥왕/진흥왕/장수왕`\n5. 통일: `나당연합-백제멸망-고구려멸망-매소성-기벌포`\n6. 발해: `대조영-무왕-문왕-선왕-해동성국`\n7. 고려: `태조-광종-성종-문벌-무신-몽골-공민왕`\n8. 조선: `태종-세종-세조-성종-사림-붕당`\n9. 조선 후기: `영정법-대동법-균역법-실학-세도정치`\n10. 근대: `강화도조약-통리기무아문-임오군란-갑신정변-동학- const STORE_KEY = "khistory_cram_srs_v2";
const LEGACY_STORE_KEY = "khistory_cram_srs_v1";
const DB_NAME = "khistory_cram_pwa_db";
const DB_STORE = "state";
let storageMode = "IndexedDB";
let deferredInstallPrompt = null;

function defaultState(){
  return {
    version: 1,
    createdAt: new Date().toISOString(),
    settings: { target: 30, unit: "전체" },
    daily: {},
    items: {},
    forcedQueue: [],
    session: { startedAt: now(), solved: 0, correct: 0, seconds: 0 }
  };
}
function normalizeState(parsed){
  const base = defaultState();
  const src = parsed && typeof parsed === "object" ? parsed : {};
  const out = Object.assign(base, src);
  out.settings = Object.assign(base.settings, src.settings || {});
  out.daily = src.daily || {};
  out.items = src.items || {};
  out.forcedQueue = src.forcedQueue || [];
  out.session = Object.assign(base.session, src.session || {});
  out.version = 2;
  return out;
}
function openAppDB(){
  return new Promise((resolve, reject)=>{
    if(!("indexedDB" in window)) return reject(new Error("IndexedDB not supported"));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB open failed"));
  });
}
async function dbGet(key){
  const db = await openAppDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    tx.oncomplete = () => db.close();
  });
}
async function dbSet(key, value){
  const db = await openAppDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
async function dbDel(key){
  const db = await openAppDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
async function loadState(){
  const fallback = () => {
    storageMode = "localStorage fallback";
    try{
      const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_STORE_KEY);
      return raw ? normalizeState(JSON.parse(raw)) : defaultState();
    }catch(e){ return defaultState(); }
  };
  try{
    const saved = await dbGet(STORE_KEY);
    if(saved){ storageMode = "IndexedDB"; return normalizeState(saved); }
    const legacyRaw = localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_STORE_KEY);
    if(legacyRaw){
      const migrated = normalizeState(JSON.parse(legacyRaw));
      await dbSet(STORE_KEY, migrated);
      storageMode = "IndexedDB migrated";
      return migrated;
    }
    const fresh = defaultState();
    await dbSet(STORE_KEY, fresh);
    storageMode = "IndexedDB";
    return fresh;
  }catch(e){
    return fallback();
  }
}
async function saveState(){
  try{
    await dbSet(STORE_KEY, state);

function getFilteredQuestions(){
  const unit = state.settings.unit || "전체";
  return DATA.questions.filter(q => unit==="전체" || q.unit===unit);

function isDue(q){
  const s = itemState(q.id);
  return !s.due || s.due <= now();
}
function accuracy(id){
  const s = itemState(id);
  return s.attempts ? s.correct / s.attempts : 0;
}
function mastery(id){
  const s = itemState(id);
  if(!s.attempts) return 0;
  let base = s.correct / Math.max(1, s.attempts);
  let bonus = Math.min(.15, s.streak * .03);
  let penalty = Math.min(.35, s.wrong * .04);
  return clamp(base + bonus - penalty, 0, 1);
}
function isWeak(q){
  const s = itemState(q.id);
  return s.forcedNeed > 0 || (s.attempts>=1 && (mastery(q.id)<.72 || s.lastWrong || s.wrong>=2));
}
function dueCount(){
  return DATA.questions.filter(q => isDue(q)).length;
}

function unitStats(){
  const map = {};
  DATA.questions.forEach(q=>{
    const s = itemState(q.id);
    if(!map[q.unit]) map[q.unit] = {unit:q.unit, solved:0, correct:0, wrong:0};
    map[q.unit].solved += s.attempts;
    map[q.unit].correct += s.correct;
    map[q.unit].wrong += s.wrong;
  });
  return Object.values(map).filter(u=>u.solved>0).map(u=>({...u, wrongRate: Math.round(u.wrong/Math.max(1,u.solved)*100)})).sort((a,b)=>b.wrongRate-a.wrongRate || b.wrong-a.wrong);
}
function startMode(mode){
  currentMode = mode;
  const q = pickQuestion(mode);
  if(!q){
    $("#view").innerHTML = `<div class="card"><h2>문항이 없습니다</h2><p>단원 필터를 전체로 바꾸거나 다른 모드를 선택하세요.</p></div>`;
    return;
  }
  renderQuestion(q);
}
function candidatePool(mode){
  let qs = getFilteredQuestions();
  if(mode==="timeline") qs = qs.filter(q=>q.type==="order");
  if(mode==="exam") qs = qs.filter(q=>q.importance>=4);
  if(mode==="weak"){
    const w = qs.filter(isWeak);
    qs = w.length ? w : qs.filter(q=>itemState(q.id).attempts===0 || q.importance>=4);
  }
  if(mode==="quiz") qs = qs;
  return qs;
}
function pickQuestion(mode){
  let qs = candidatePool(mode);
  if(!qs.length) return null;
  const forced = qs.filter(q => itemState(q.id).forcedNeed>0);
  if((mode==="weak" || mode==="exam") && forced.length) qs = forced;
  let candidates = qs.map(q=>{
    const s = itemState(q.id);
    let w = q.importance;
    if(!s.attempts) w += 3;
    if(isDue(q)) w += 3;
    if(isWeak(q)) w += 6;
    w += Math.max(0, s.wrong - s.correct) * 2;
    if(q.id===lastQuestionId && qs.length>1) w = Math.max(1, w-6);
    return {q,w};
  });
  const sum = candidates.reduce((a,c)=>a+c.w,0);
  let r = Math.random()*sum;
  for(const c of candidates){ r -= c.w; if(r <= 0){ lastQuestionId = c.q.id; return c.q; } }
  return candidates[0].q;
}

    area.querySelectorAll(".choice").forEach(btn=>btn.addEventListener("click",()=>{

function getUserAnswer(q){
  if(q.type==="cloze") return ($("#clozeInput")?.value || "").trim();
  if(q.type==="order") return currentOrder;
  return currentSelection;
}
function checkAnswer(q, ans){
  if(q.type==="mcq" || q.type==="tf") return ans === q.answer;
  if(q.type==="cloze"){
    const user = normalize(ans);
    const answers = Array.isArray(q.answer) ? q.answer : [q.answer];
    return answers.some(a => normalize(a) === user);
  }
  if(q.type==="order"){
    return Array.isArray(ans) && ans.length===q.answer.length && ans.every((v,i)=>v===q.answer[i]);
  }
  return false;
}
function correctAnswerText(q){
  if(q.type==="mcq") return `${q.answer+1}. ${q.choices[q.answer]}`;
  if(q.type==="tf") return q.answer ? "O" : "X";
  if(q.type==="cloze") return Array.isArray(q.answer) ? q.answer[0] : q.answer;
  if(q.type==="order") return q.answer.join(" → ");
  return "";
}
function submitAnswer(){
  const q = currentQuestion;

  markChoices(q, correct);

      ${!correct ? `<div style="margin-top:8px" class="badge weak">연속 3회 정답 전까지 취약점 모드에서 반복</div>` : ""}

function markChoices(q, correct){
  const area = $("#answerArea");
  area.querySelectorAll("button").forEach(b=>b.disabled=true);
  if(q.type==="mcq"){
    area.querySelectorAll(".choice").forEach(btn=>{
      const idx = Number(btn.dataset.choice);
      if(idx===q.answer) btn.classList.add("correct");
      else if(idx===currentSelection && !correct) btn.classList.add("wrong");
    });
  }
  if(q.type==="tf"){
    area.querySelectorAll(".choice").forEach(btn=>{
      const val = btn.dataset.choice === "true";
      if(val===q.answer) btn.classList.add("correct");
      else if(val===currentSelection && !correct) btn.classList.add("wrong");
    });
  }
}
function recordResult(q, correct, seconds){
  const s = itemState(q.id);
  s.attempts += 1;
  s.last = now();
  s.totalSeconds += seconds;
  if(correct){
    s.correct += 1; s.streak += 1; s.bestStreak = Math.max(s.bestStreak||0, s.streak); s.lastWrong = false;
    applySrs(q.id, s.forcedNeed>0 ? "hard" : "good");
    if(s.forcedNeed>0){
      s.forceStreak = (s.forceStreak||0) + 1;
      if(s.forceStreak >= s.forcedNeed){ s.forcedNeed = 0; s.forceStreak = 0; }
    }
  }else{
    s.wrong += 1; s.streak = 0; s.lastWrong = true;
    s.forcedNeed = Math.max(s.forcedNeed||0, 3);
    s.forceStreak = 0;
    applySrs(q.id, "again");
  }
  const dkey = todayKey();
  if(!state.daily[dkey]) state.daily[dkey] = {solved:0,correct:0,seconds:0,byUnit:{}};
  const d = state.daily[dkey];
  d.solved += 1; d.correct += correct?1:0; d.seconds += seconds;
  if(!d.byUnit[q.unit]) d.byUnit[q.unit] = {solved:0,correct:0,wrong:0,seconds:0};
  d.byUnit[q.unit].solved += 1; d.byUnit[q.unit].correct += correct?1:0; d.byUnit[q.unit].wrong += correct?0:1; d.byUnit[q.unit].seconds += seconds;
  state.session.solved += 1; state.session.correct += correct?1:0; state.session.seconds += seconds;
}
function applySrs(id, grade){
  const s = itemState(id);
  if(!s.ease) s.ease = 2.5;
  if(grade==="again"){
    s.interval = 0; s.ease = Math.max(1.3, s.ease - .25); s.due = now() + 2*60*1000;
  }else if(grade==="hard"){
    s.interval = Math.max(1, Math.round((s.interval||1)*1.2)); s.ease = Math.max(1.3, s.ease - .1); s.due = now() + s.interval*24*60*60*1000;
  }else if(grade==="good"){
    s.interval = s.interval ? Math.round(s.interval*s.ease) : 1; s.due = now() + s.interval*24*60*60*1000;
  }else if(grade==="easy"){
    s.interval = s.interval ? Math.round(s.interval*(s.ease+.7)) : 3; s.ease += .15; s.due = now() + s.interval*24*60*60*1000;
  }
}
function renderHint(){
  if(!currentQuestion) return;
  const q = currentQuestion;
  toast(`힌트: ${q.tags?.[0] || q.topic} / 중요도 ${"★".repeat(q.importance)}`);
}
function renderAnki(){
  const qs = getFilteredQuestions();
  let due = qs.filter(isDue);
  let weak = qs.filter(isWeak);
  let pool = due.length ? due : (weak.length ? weak : qs);
  const q = weightedPick(pool);
  renderFlash(q);
}
function renderAnkiFor(id){
  const q = DATA.questions.find(x=>x.id===id);
  currentView = "anki";
  renderFlash(q);
}
function weightedPick(qs){
  if(!qs.length) return null;
  const arr = qs.map(q=>({q,w:q.importance + (isWeak(q)?6:0) + (isDue(q)?3:0) + (itemState(q.id).attempts?0:3)}));
  let sum = arr.reduce((a,c)=>a+c.w,0), r=Math.random()*sum;
  for(const c of arr){ r-=c.w; if(r<=0) return c.q; }
  return arr[0].q;
}
function renderFlash(q){
  if(!q){ $("#view").innerHTML=`<div class="card"><h2>카드가 없습니다</h2></div>`; return; }
  flash = {q, flipped:false};
  const s = itemState(q.id);
  $("#view").innerHTML = `
    <div class="question-wrap">
      <section class="card">
        <div class="qmeta">
          <span class="badge">${esc(q.unit)}</span><span class="badge hot">중요도 ${"★".repeat(q.importance)}</span>
          ${isWeak(q)?`<span class="badge weak">취약</span>`:""}
          ${isDue(q)?`<span class="badge good">복습 예정</span>`:""}
        </div>
        <div class="flashcard" id="flashcard" onclick="flipFlash()">
          <div class="flash-front">${esc(q.prompt.replace("{{answer}}","________"))}</div>
        </div>
        <div class="anki-buttons">
          <button class="btn danger" onclick="gradeFlash('again')">Again<br><span class="tiny">2분 뒤</span></button>
          <button class="btn warn" onclick="gradeFlash('hard')">Hard<br><span class="tiny">짧게</span></button>
          <button class="btn ok" onclick="gradeFlash('good')">Good<br><span class="tiny">정상</span></button>
          <button class="btn" onclick="gradeFlash('easy')">Easy<br><span class="tiny">길게</span></button>
        </div>
      </section>
      <aside class="card" style="position:static;height:auto;color:var(--ink);background:var(--panel);border-color:var(--line)">
        <h2>ANKI 상태</h2>
        <div class="list">
          <div class="row"><span>간격</span><b>${s.interval||0}일</b></div>
          <div class="row"><span>Ease</span><b>${(s.ease||2.5).toFixed(2)}</b></div>
          <div class="row"><span>숙련도</span><b>${Math.round(mastery(q.id)*100)}%</b></div>
        </div>
        <p class="tiny" style="margin-top:12px">카드를 클릭하면 정답과 해설이 보입니다.</p>
      </aside>
    </div>`;
}
function flipFlash(){
  flash.flipped = !flash.flipped;
  const q = flash.q;
  $("#flashcard").innerHTML = flash.flipped
    ? `<div class="flash-back"><b>정답</b><br>${esc(correctAnswerText(q))}<br><br><b>해설</b><br>${esc(q.explanation)}</div>`
    : `<div class="flash-front">${esc(q.prompt.replace("{{answer}}","________"))}</div>`;
}
function gradeFlash(grade){
  if(!flash.q) return;
  const q = flash.q;
  const s = itemState(q.id);
  s.attempts += 1;
  if(grade==="again"){ s.wrong += 1; s.streak = 0; s.lastWrong = true; s.forcedNeed = Math.max(s.forcedNeed||0, 3); s.forceStreak = 0; }
  else { s.correct += 1; s.streak += 1; s.bestStreak = Math.max(s.bestStreak||0, s.streak); s.lastWrong = false; if(s.forcedNeed>0 && grade!=="again"){ s.forceStreak=(s.forceStreak||0)+1; if(s.forceStreak>=s.forcedNeed){s.forcedNeed=0;s.forceStreak=0;} } }
  applySrs(q.id, grade);
  const dkey = todayKey();
  if(!state.daily[dkey]) state.daily[dkey] = {solved:0,correct:0,seconds:0,byUnit:{}};
  state.daily[dkey].solved += 1;
  state.daily[dkey].correct += grade==="again" ? 0 : 1;
  saveState();
  toast("복습 간격이 저장되었습니다.");
  renderAnki();
}

      <div class="list weak-list">${wrong.map(q=>{

        return `<div class="row">
          <div><div class="main">${esc(q.topic)} · 오답 ${s.wrong}회</div><div class="desc">${esc(q.prompt).slice(0,120)}${q.prompt.length>120?"…":""}</div></div>
          <button class="btn small" onclick="startSpecific('${q.id}','weak')">다시 풀기</button>

}
function renderNotes(){
  $("#view").innerHTML = `
    <div class="card">
      <div style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px">

  $("#noteSearch").addEventListener("input", e=>{

  });

function renderData(){
  const rows = Object.entries(state.daily).sort((a,b)=>b[0].localeCompare(a[0]));
  $("#view").innerHTML = `
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card">
        <h2>학습량 기록</h2>
        <div class="list">${rows.slice(0,30).map(([date,d])=>`
          <div class="row">
            <div><div class="main">${date}</div><div class="desc">${Math.round((d.seconds||0)/60)}분 학습</div></div>
            <div style="text-align:right"><b>${d.solved||0}문항</b><div class="desc">정답률 ${d.solved?Math.round(d.correct/d.solved*100):0}%</div></div>
          </div>`).join("") || `<p>기록이 없습니다.</p>`}</div>
      </div>
      <div class="card">
        <h2>데이터 관리</h2>
        <p>학습 기록은 IndexedDB에 우선 저장됩니다. 패드 저장공간 정리나 브라우저 데이터 삭제에 대비해 시험 전에는 JSON 백업을 권장합니다.</p>
        <p class="tiny">현재 저장 방식: <b>${storageMode}</b></p>
        <div class="list">
          <button class="btn" onclick="exportJSON()">학습 데이터 JSON 내보내기</button>
          <button class="btn secondary" onclick="exportCSV()">일별 학습량 CSV 내보내기</button>
          <label class="btn secondary" style="text-align:center;cursor:pointer">JSON 가져오기<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)"></label>

function exportJSON(){
  download("한국사_학습데이터.json", JSON.stringify(state,null,2), "application/json");
}
function exportCSV(){
  const lines = ["date,solved,correct,accuracy,seconds,minutes"];
  Object.entries(state.daily).sort().forEach(([date,d])=>{
    const acc = d.solved ? (d.correct/d.solved*100).toFixed(1) : "0";
    lines.push([date,d.solved||0,d.correct||0,acc,d.seconds||0,Math.round((d.seconds||0)/60)].join(","));
  });
  download("한국사_학습량.csv", lines.join("\n"), "text/csv;charset=utf-8");
}
function importJSON(event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(reader.result);
      if(!obj.items || !obj.daily) throw new Error("형식 오류");
      state = normalizeState(obj); saveState(); toast("데이터를 가져왔습니다."); go("dashboard");
    }catch(e){ toast("가져오기 실패: JSON 형식을 확인하세요."); }
  };
  reader.readAsText(file);
}
async function resetData(){
  if(confirm("학습 기록을 모두 삭제할까요?")){
    state = defaultState();
    try{ await dbDel(STORE_KEY); }catch(e){}
    try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(LEGACY_STORE_KEY); }catch(e){}
    await saveState();
    go("dashboard");
  }
}
function download(name, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function normalize(s){
  return String(s).toLowerCase().replace(/\s+/g,"").replace(/[()·,\.]/g,"");
}
function clamp(x,a,b){ return Math.min(b,Math.max(a,x)); }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}
function registerPWA(){
  if("serviceWorker" in navigator && location.protocol !== "file:"){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
  });
}
async function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    toast("설치 요청을 완료했습니다.");
    return;
  }
  const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if(isiOS) toast("iPad Safari: 공유 버튼 → 홈 화면에 추가를 선택하세요.");
  else toast("브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 선택하세요.");
}
function markdownToHtml(md){
  const lines = md.split("\n");
  let html = "", inList=false, table=[];
  function flushTable(){
    if(!table.length) return;
    const rows = table.filter(l=>l.trim().startsWith("|"));
    if(rows.length){
      const trs = rows.filter((r,i)=>!/^\s*\|?\s*[-:| ]+\s*\|?\s*$/.test(r)).map((r,i)=>{
        const cells = r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
        const tag = i===0 && rows.length>1 ? "th" : "td";
        return `<tr>${cells.map(c=>`<${tag}>${c}</${tag}>`).join("")}</tr>`;
      }).join("");
      html += `<table>${trs}</table>`;
    }
    table=[];
  }
  function flushList(){ if(inList){ html += "</ul>"; inList=false; } }
  for(const raw of lines){
    const line = raw.trimEnd();
    if(line.trim().startsWith("|")){ flushList(); table.push(line); continue; } else flushTable();
    if(!line.trim()){ flushList(); continue; }
    if(line.startsWith("# ")){ flushList(); html += `<h1>${inline(line.slice(2))}</h1>`; continue; }
    if(line.startsWith("## ")){ flushList(); html += `<h2>${inline(line.slice(3))}</h2>`; continue; }
    if(line.startsWith("### ")){ flushList(); html += `<h3>${inline(line.slice(4))}</h3>`; continue; }
    if(line.startsWith(">")){ flushList(); html += `<blockquote>${inline(line.replace(/^>\s?/,""))}</blockquote>`; continue; }
    if(/^[-*]\s+/.test(line)){ if(!inList){html+="<ul>"; inList=true;} html += `<li>${inline(line.replace(/^[-*]\s+/,""))}</li>`; continue; }
    flushList(); html += `<p>${inline(line)}</p>`;
  }
  flushTable(); flushList();
  return html;
}
function inline(s){
  return esc(s)
    .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
}
