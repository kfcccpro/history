<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한국사Ⅱ · 취약 문제 복습</title>
<meta name="color-scheme" content="light">
<style>
:root{--ink:#102946;--muted:#60748b;--line:#d8e3ec;--soft:#f5f8fb;--navy:#102b4c;--green:#0b765c;--green-soft:#e9f7f1;--red:#b42318;--red-soft:#fff2f0;--blue:#1d6fb8;--blue-soft:#eef7ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fa;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}#app{min-height:100dvh}.shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:18px;padding:18px clamp(16px,3vw,44px) 22px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.kicker{font-size:18px;font-weight:950;color:#55708f}.title{margin:4px 0 0;font-size:clamp(30px,3.6vw,50px);line-height:1.14}.progress{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;color:#47627f}.progress b{font-size:26px;color:var(--navy)}.card{width:min(1320px,100%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 36px rgba(16,43,76,.07);padding:clamp(22px,3vw,38px)}.lead{font-size:clamp(28px,3vw,42px);font-weight:1000;line-height:1.3;letter-spacing:-.03em}.sub{font-size:20px;line-height:1.55;color:var(--muted);font-weight:820;margin-top:12px}.primary{width:min(720px,100%);min-height:76px;border:0;border-radius:18px;background:var(--navy);color:#fff;font-weight:1000;font-size:24px;cursor:pointer}.secondary{min-height:54px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:900;padding:0 20px;cursor:pointer}.start{display:grid;gap:24px;text-align:center;justify-items:center}.weak-list{width:min(900px,100%);display:grid;gap:10px;text-align:left}.weak-item{border:1px solid #dbe5ee;border-radius:15px;background:#f8fafc;padding:14px 16px}.weak-item b{font-size:20px}.weak-item span{display:block;margin-top:5px;font-size:16px;color:var(--muted);font-weight:800}.qmeta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:17px;color:var(--muted);font-weight:900}.concept{display:inline-flex;background:var(--blue-soft);color:#1b5f98;border-radius:999px;padding:8px 12px}.qtext{font-size:clamp(28px,2.8vw,40px);line-height:1.48;font-weight:1000;word-break:keep-all;margin:22px 0}.choices{display:grid;gap:13px}.choice{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:17px;padding:19px 21px;min-height:76px;display:flex;align-items:flex-start;gap:14px;color:var(--ink);font-weight:900;font-size:21px;line-height:1.5;cursor:pointer}.choice .n{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:#eef3f7;display:grid;place-items:center;font-weight:1000;color:#47627f}.choice.correct{border-color:#5bb28f;background:var(--green-soft)}.choice.wrong{border-color:#e69d95;background:var(--red-soft)}.feedback{margin-top:18px;display:grid;gap:10px;border-radius:16px;padding:18px 20px;font-size:19px;font-weight:850;line-height:1.55}.feedback.good{background:var(--green-soft);color:#135f4b}.feedback.bad{background:var(--red-soft);color:#89281f}.feedback strong{font-size:24px}.diagnosis{display:grid;gap:13px;padding:20px 22px;border:1px solid #d7e4ee;border-radius:19px;background:#f7fafc}.diag-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.diag-head b{font-size:19px;color:var(--red)}.badge{border-radius:999px;padding:8px 12px;background:#eaf4fc;color:#225f91;font-size:17px;font-weight:1000}.diag-main{font-size:clamp(22px,1.9vw,28px);line-height:1.5;font-weight:950}.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.step{min-height:62px;border:2px solid #e0e8ef;border-radius:14px;background:#fff;color:#718297;display:grid;place-items:center;text-align:center;padding:8px;font-size:16px;font-weight:950;line-height:1.3}.step.on{border-color:#6fa8cf;background:#eaf4fc;color:#1e6498}.focus{margin-top:14px;padding:16px 18px;border-radius:16px;background:#fff8e8;border:1px solid #efd69e;font-size:20px;font-weight:900;line-height:1.5}.path{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}.path span{background:#eef3f7;border-radius:999px;padding:9px 12px;font-size:17px;font-weight:900}.path i{font-style:normal;color:#8798a9}.clue{font-size:clamp(24px,2.2vw,32px);line-height:1.5;font-weight:1000}.judge{border-top:1px solid var(--line);padding-top:18px;margin-top:18px;display:grid;gap:12px}.judge-label{font-size:18px;font-weight:900;color:var(--muted)}.judge-statement{border:1px solid var(--line);background:var(--soft);border-radius:16px;padding:18px 20px;font-size:clamp(21px,2vw,28px);line-height:1.5;font-weight:900}.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ox button{border:2px solid var(--line);background:#fff;border-radius:17px;min-height:78px;font-size:22px;font-weight:1000;cursor:pointer}.ox button strong{font-size:36px;margin-right:8px}.correction{background:#fff8e8;border:1px solid #efd69e;border-radius:15px;padding:15px 17px;font-size:19px;font-weight:900;line-height:1.5}.done{display:grid;gap:20px;text-align:center;justify-items:center}.done h2{font-size:clamp(34px,4vw,52px);margin:0}.foot{text-align:center;color:#8493a3;font-size:14px;font-weight:800}@media(max-width:800px){.top{flex-direction:column}.ladder{grid-template-columns:1fr 1fr}.choice{font-size:19px}.ox button{min-height:68px}.card{padding:20px 16px}}
</style>
</head>
<body><main id="app"></main>
<script src="app_mode_config.js"></script>
<script src="firebase_config.js"></script>
<script src="sync_local_hook.js"></script>
<script src="firebase_sync_engine.js"></script>
<script src="weakness_profile_engine.js"></script>
<script src="adaptive_fast_review.js"></script>
</body></html>
