 return {...m,score,reasons:[...new Set(reasons)],attempted:attempts.length>0,mastered:ps.status==='mastered'} }
function allScores(){return META.map(scoreProblem)}
function hasAnyStudy(){return Object.values(STORAGE).some((k)=>{try{const s=JSON.parse(localStorage.getItem(k)||'{}');return (s.attempts||[]).length||Object.keys(s.memoryLog||{}).length}catch(e){return false}})}
function buildQueue(){let arr=allScores().filter(x=>x.score>0).sort((a,b)=>b.score-a.score);if(!arr.length){arr=allScores().filter(x=>x.day===6).slice(0,SESSION_SIZE);arr.forEach((x,i)=>x.score=10-i)}
 const out=[],dayCount={},conceptCount={};
 // first pass: broad coverage
 for(const x of arr){if(out.length>=SESSION_SIZE)break;if((dayCount[x.day]||0)>=2||(conceptCount[x.conceptId]||0)>=1)continue;out.push(x);dayCount[x.day]=(dayCount[x.day]||0)+1;conceptCount[x.conceptId]=(conceptCount[x.conceptId]||0)+1}
 // second pass: fill by score
 for(const x of arr){if(out.length>=SESSION_SIZE)break;if(out.some(y=>y.uid===x.uid)||(dayCount[x.day]||0)>=2)continue;out.push(x);dayCount[x.day]=(dayCount[x.day]||0)+1}
 return out.slice(0,SESSION_SIZE)
}
function loadSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(s&&Array.isArray(s.items)&&s.index<s.items.length)return s}catch(e){}return null}
function createSession(){const q=buildQueue(),s={id:'a'+Date.now().toString(36),createdAt:Date.now(),updatedAt:Date.now(),index:0,completed:[],items:q.map(({uid,day,problemId,app,title,source,conceptTitle,branch,score,reasons})=>({uid,day,problemId,app,title,source,conceptTitle,branch,score,reasons}))};localStorage.setItem(SESSION_KEY,JSON.stringify(s));return s}
function session(){return loadSession()||createSession()}
function saveHistory(s){try{const h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!h.some(x=>x.id===s.id))h.unshift({id:s.id,createdAt:s.createdAt,finishedAt:Date.now(),items:s.items.length});localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,30)))}catch(e){}}
function startItem(){const s=session();if(s.index>=s.items.length){saveHistory(s);localStorage.removeItem(SESSION_KEY);render();return}const x=s.items[s.index];const params=new URLSearchParams({adaptive:'1',problem:x.problemId,session:s.id,slot:String(s.index),return:'korean_history2_unit1_adaptive_review_metacog_flow.html'});location.href=x.app+'?'+params.toString()}
function weakByBranch(){const map=new Map();for(const x of allScores()){const k=`Day ${x.day} · ${x.branch||x.conceptTitle}`;const cur=map.get(k)||{name:k,score:0,nodes:[]};cur.score=Math.max(cur.score,x.score);cur.nodes.push(x);map.set(k,cur)}return [...map.values()].sort((a,b)=>b.score-a.score)}
function weakestConcept(){return allScores().filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0]||allScores().find(x=>x.day===6)}
function renderStudent(){const studied=hasAnyStudy();if(!studied)return `<div class="eyebrow">적응형 복습</div><div class="panel empty"><h2>먼저 Day 1~6을 학습해 주세요.</h2><p class="small">오답·키워드 입력 기록이 생기면 자동으로 약한 문제 순서를 계산합니다.</p><div class="controls" style="justify-content:center"><a class="secondary" href="korean_history2_unit1_student_metacog_flow.html">대단원 학습 허브</a></div></div>`;
 const s=session(),idx=Math.min(s.index,s.items.length),left=Math.max(0,s.items.length-idx),cur=s.items[idx]||null,weak=weakestConcept();if(!cur){saveHistory(s);localStorage.removeItem(SESSION_KEY);return `<div class="panel empty"><div class="eyebrow">오늘 복습 완료</div><h2>약한 가지를 한 번 더 연결했습니다.</h2><p class="small">다음 복습 때 최신 오답 기록으로 순서를 다시 계산합니다.</p><button class="primary" id="newSession">새 복습 계산</button></div>`}
 return `<div class="eyebrow">대단원 I · 적응형 복습</div><div class="hero"><div><h1>오늘은<br>${left}문제만.</h1><p>틀린 횟수·오답 뎁스·키워드 회상 기록을 합쳐 약한 문제부터 자동으로 배치했습니다.</p></div><div class="count"><b>${idx+1}</b><span>/ ${s.items.length}</span></div></div><section class="panel start-card"><div class="focus">지금 집중할 가지</div><h2 class="focus-word">${esc(cur.conceptTitle)}</h2><div class="focus-sub">${esc(cur.branch)} · ${esc(cur.title)}<br><span class="small">${esc(cur.source)}</span></div><div class="progress"><i style="width:${Math.round(idx/s.items.length*100)}%"></i></div><div class="small">${cur.reasons.map(r=>`<span class="tag ${/오답|복구|회상/.test(r)?'hot':'warn'}">${esc(r)}</span>`).join(' ')}</div><button class="primary" id="startItem" style="margin-top:22px">원문 문제 풀기</button></section><section class="panel"><div class="parent-head"><div><b>가장 약한 가지</b><div class="small">학생에게는 현재 문제만 보여주고, 전체 분석은 아래에서 확인합니다.</div></div><button class="secondary" id="toggleAnalysis">분석 보기</button></div><div id="analysis" class="hidden">${renderAnalysis()}</div></section>`}
function renderAnalysis(){const scores=allScores(),weak=scores.filter(x=>x.score>0).sort((a,b)=>b.score-a.score),states=Object.keys(STORAGE).map(Number).map(d=>getState(d)),attempts=states.reduce((n,s)=>n+(s.attempts||[]).length,0),wrong=weak.filter(x=>x.reasons.some(r=>r.startsWith('오답'))).length,mem=weak.filter(x=>x.reasons.some(r=>r.includes('회상'))).length;const branches=weakByBranch().filter(x=>x.score>0).slice(0,12);return `<div class="kpis"><div class="kpi"><span class="small">총 풀이</span><b>${attempts}</b></div><div class="kpi"><span class="small">취약 문항</span><b>${weak.length}</b></div><div class="kpi"><span class="small">오답 반복</span><b>${wrong}</b></div><div class="kpi"><span class="small">회상 실패</span><b>${mem}</b></div></div><div class="weak-map" style="margin-top:22px"><div class="root">대단원 I<br><span class="small" style="color:#c7d4e6">취약 가지 지도</span></div><div class="branches">${branches.map(b=>`<div class="branch"><div class="branch-name">${esc(b.name)}</div><div class="nodes">${b.nodes.filter(n=>n.score>0).sort((a,c)=>c.score-a.score).slice(0,4).map(n=>`<span class="node ${n.score>=20?'hot':n.score>=10?'warm':'ok'}">${esc(n.conceptTitle)} · ${n.score}</span>`).join('')}</div></div>`).join('')}</div></div><table class="table"><thead><tr><th>우선</th><th>문항</th><th>가지</th><th>이유</th></tr></thead><tbody>${weak.slice(0,12).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.title)}</b><div class="small">Day ${x.day} · ${esc(x.source)}</div></td><td>${esc(x.conceptTitle)}</td><td>${x.reasons.map(r=>`<span class="tag">${esc(r)}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table><div class="controls"><button class="secondary" id="recalc">오늘 순서 다시 계산</button><a class="secondary" href="korean_history2_unit1_student_metacog_flow.html">전체 학습 허브</a></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){app.innerHTML=renderStudent();document.getElementById('startItem')?.addEventListener('click',startItem);document.getElementById('newSession')?.addEventListener('click',()=>{localStorage.removeItem(SESSION_KEY);render()});document.getElementById('toggleAnalysis')?.addEventListener('click',()=>{document.getElementById('analysis')?.classList.toggle('hidden')});document.getElementById('recalc')?.addEventListener('click',()=>{localStorage.removeItem(SESSION_KEY);render()})}
render();
