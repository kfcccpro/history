name: Firebase Hosting auto deploy

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-deploy.yml'
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HISTORY_698F7 }}'
          projectId: history-698f7
          channelId: live
          entryPoint: .
